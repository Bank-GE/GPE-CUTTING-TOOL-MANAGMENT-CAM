<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tool Viewer</title>
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tool Viewer">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d12; --panel: #131720; --panel2: #1a1f2b; --line: #262d3b; --line2: #354052;
    --text: #edf0f5; --muted: #8e98aa; --faint: #5b6476;
    --brand: #6ea8ff; --brand2: #b18cff;
    --ok: #3ddc97; --warn: #ffc23d; --err: #ff5c6c; --flag: #ff4d5e;
    --new: #4f8cff; --used: #ffb547; --rg: #b18cff;
    --mono: 'Share Tech Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans Thai', system-ui, sans-serif;
    --c: var(--brand);   /* สีหมวดของทูลที่เลือก (เปลี่ยนตามหมวด) */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  body { background: radial-gradient(1200px 500px at 0% -10%, rgba(110,168,255,.10), transparent 60%), radial-gradient(900px 500px at 100% -20%, rgba(177,140,255,.10), transparent 60%), var(--bg); }
  [hidden] { display: none !important; }
  button { touch-action: manipulation; font: inherit; }

  /* ---------- เต็มจอ ไม่ต้องเลื่อนทั้งหน้า — แต่ละช่องเลื่อนในตัวเอง ---------- */
  .app { height: 100vh; height: 100dvh; display: grid; gap: 12px; overflow: hidden;
         grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr);
         grid-template-areas: "top" "kpi" "ctl" "list";
         padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  .top { grid-area: top; } .kpis { grid-area: kpi; } .controls { grid-area: ctl; } .listwrap { grid-area: list; } .side { display: none; } .detail { grid-area: list; }
  @media (min-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); grid-template-rows: auto auto minmax(0, 1fr);
           grid-template-areas: "top top" "ctl kpi" "list detail"; padding: 14px 18px; gap: 12px 16px; }
    .detail { grid-area: detail; }
  }
  @media (min-width: 1180px) {
    .app { grid-template-columns: 230px minmax(0, 1fr) minmax(0, 1.1fr); grid-template-rows: auto auto minmax(0, 1fr);
           grid-template-areas: "top top top" "side ctl kpi" "side list detail"; padding: 16px 22px; gap: 14px 18px; }
    .side { display: flex; grid-area: side; }
    .controls .chips .cat { display: none; }
  }

  /* ---------- top bar ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { flex: none; width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--brand), var(--brand2)); display: grid; place-items: center; color: #0b0d12; font-family: var(--mono); font-size: 15px; font-weight: 700; }
  .brand b { font-family: var(--mono); font-size: 16px; letter-spacing: .12em; font-weight: 400; white-space: nowrap; }
  .brand b span { background: linear-gradient(90deg, var(--brand), var(--brand2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sync { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); opacity: .6; cursor: pointer; flex: none; }
  body[data-sync=busy] .sync { background: var(--brand); opacity: 1; animation: blink 1s ease-in-out infinite; }
  body[data-sync=err] .sync { background: var(--warn); opacity: 1; }
  @keyframes blink { 50% { opacity: .25; } }
  .tacts { display: flex; align-items: center; gap: 8px; flex: none; }
  .upd { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; margin-right: 4px; }
  .tbtn { border: 1px solid var(--line2); background: var(--panel); color: var(--text); border-radius: 10px; height: 40px; padding: 0 14px; cursor: pointer; font-size: 15px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
  .tbtn:hover { border-color: var(--brand); }
  .tbtn.req { background: linear-gradient(135deg, #ff8a3d, #ff5c8a); border: 0; color: #fff; font-weight: 600; }
  .tbtn .n { font-family: var(--mono); background: rgba(255,255,255,.18); border-radius: 999px; padding: 0 7px; font-size: 13px; }
  .tbtn.trk .n { background: var(--brand2); color: #0b0d12; }
  @media (max-width: 759px) { .upd, .tbtn .tx { display: none; } .tbtn { padding: 0 11px; } .brand b { font-size: 14px; } }

  /* ---------- KPI ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .kpi { border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; background: var(--panel); cursor: pointer; text-align: left; color: var(--text); min-width: 0; }
  .kpi i { display: block; font-style: normal; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi b { display: block; font-family: var(--mono); font-weight: 400; font-size: 24px; line-height: 1.1; }
  .kpi.k1 b { color: var(--brand); } .kpi.k2 b { color: var(--warn); } .kpi.k3 b { color: var(--flag); } .kpi.k4 b { color: var(--brand2); }
  .kpi.on { border-color: currentColor; background: var(--panel2); }
  @media (max-width: 759px) { .kpi { padding: 5px 9px; } .kpi b { font-size: 20px; } }

  /* ---------- ค้นหา ---------- */
  .controls { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .search { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; padding-left: 14px; }
  .search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(110,168,255,.15); }
  .search svg.mg { flex: none; width: 19px; height: 19px; color: var(--faint); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 17px; height: 48px; padding: 0 10px; }
  .search input::placeholder { color: var(--faint); }
  .search kbd { font-family: var(--mono); font-size: 12px; color: var(--faint); border: 1px solid var(--line2); border-radius: 6px; padding: 1px 7px; margin-right: 10px; }
  .search .clr { flex: none; border: 0; background: none; color: var(--muted); font-size: 22px; width: 40px; height: 48px; cursor: pointer; }
  .cam { flex: none; height: 48px; width: 54px; border: 0; border-left: 1px solid var(--line2); background: none; color: var(--text); cursor: pointer; display: grid; place-items: center; border-radius: 0 12px 12px 0; }
  .cam svg { width: 23px; height: 23px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line2); border-radius: 999px; padding: 5px 12px; font-size: 14px; color: var(--muted); background: var(--panel); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .chip .d { width: 9px; height: 9px; border-radius: 50%; background: var(--cc, var(--muted)); }
  .chip b { font-family: var(--mono); font-weight: 400; color: var(--faint); }
  .chip.on { background: color-mix(in srgb, var(--cc, var(--brand)) 22%, var(--panel)); border-color: var(--cc, var(--brand)); color: var(--text); }
  .chip.on b { color: var(--text); }
  .chip.tg.on { --cc: var(--brand); }
  @media (max-width: 759px) { kbd { display: none; } }

  /* ---------- แถบหมวด (PC จอกว้าง) ---------- */
  .side { flex-direction: column; gap: 4px; min-height: 0; overflow: auto; padding-right: 2px; }
  .side h5 { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 400; margin: 6px 6px 4px; }
  .side button { display: flex; align-items: center; gap: 10px; width: 100%; border: 1px solid transparent; background: none; color: var(--muted); border-radius: 10px; padding: 9px 10px; cursor: pointer; text-align: left; font-size: 15px; }
  .side button .d { flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--cc, var(--muted)); }
  .side button span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side button b { font-family: var(--mono); font-weight: 400; font-size: 14px; color: var(--faint); }
  .side button:hover { background: var(--panel); color: var(--text); }
  .side button.on { background: color-mix(in srgb, var(--cc, var(--brand)) 18%, var(--panel)); border-color: color-mix(in srgb, var(--cc, var(--brand)) 60%, transparent); color: var(--text); }
  .side button.on b { color: var(--text); }
  .side .sep { height: 1px; background: var(--line); margin: 8px 6px; }

  /* ---------- รายการ ---------- */
  .listwrap { display: flex; flex-direction: column; min-height: 0; gap: 6px; }
  .list { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .row { display: grid; grid-template-columns: 5px 52px 1fr auto; gap: 0 12px; width: 100%; text-align: left; border: 0; background: none; color: var(--text);
         padding: 10px 14px 10px 0; cursor: pointer; align-items: center; }
  .row + .row { border-top: 1px solid var(--line); }
  .row:hover { background: var(--panel2); }
  .row.sel { background: color-mix(in srgb, var(--cc) 14%, var(--panel)); }
  .row .bar { grid-row: 1 / span 3; align-self: stretch; border-radius: 0 4px 4px 0; background: var(--cc); }
  .row .th { grid-row: 1 / span 3; width: 52px; height: 52px; border-radius: 10px; background: color-mix(in srgb, var(--cc) 18%, var(--panel2)); border: 1px solid color-mix(in srgb, var(--cc) 40%, transparent);
             display: grid; place-items: center; font-family: var(--mono); font-size: 14px; color: var(--cc); overflow: hidden; }
  .row .th img { width: 100%; height: 100%; object-fit: cover; }
  .row b { font-weight: 500; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sp { grid-column: 3; font-family: var(--mono); font-size: 14px; color: var(--cc); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row small { grid-column: 3; font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .q { grid-column: 4; grid-row: 1 / span 3; text-align: right; font-family: var(--mono); font-size: 27px; line-height: 1; color: var(--ok); }
  .row .q i { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .03em; }
  .row.st-LOW .q { color: var(--warn); } .row.st-OUT .q { color: var(--flag); }
  .row mark { background: none; color: var(--text); text-decoration: underline; text-decoration-color: var(--cc); text-underline-offset: 3px; }
  .empty { padding: 26px 16px; color: var(--muted); text-align: center; font-size: 15px; line-height: 1.6; }
  .more { width: 100%; border: 0; border-top: 1px solid var(--line); background: none; color: var(--muted); padding: 14px; cursor: pointer; font-size: 15px; }
  .foot { font-size: 12px; color: var(--faint); padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- รายละเอียด ---------- */
  .detail { min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; }
  .dband { height: 6px; flex: none; background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 30%, transparent)); border-radius: 14px 14px 0 0; }
  .dbody { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
  .dhead { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: start; }
  .dhead .kicker { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; color: var(--c); text-transform: uppercase; }
  .dhead h2 { font-size: 24px; font-weight: 600; line-height: 1.25; grid-column: 1; }
  .dhead .idl { grid-column: 1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--mono); font-size: 15px; color: var(--muted); }
  .dhead .rbtn { grid-column: 2; grid-row: 1 / span 3; align-self: start; }
  .copy { border: 1px solid var(--line2); background: none; color: var(--muted); border-radius: 8px; font-size: 12px; padding: 3px 9px; cursor: pointer; }
  .rbtn { border: 0; border-radius: 12px; height: 46px; padding: 0 16px; cursor: pointer; font-weight: 600; font-size: 16px; color: #fff; background: linear-gradient(135deg, #ff8a3d, #ff5c8a); white-space: nowrap; }
  .back { display: none; }
  .hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .hero.hasimg { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
  .hero .img { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #000; min-height: 150px; display: block; }
  .hero .img img { width: 100%; height: 100%; max-height: 260px; object-fit: contain; display: block; }
  .speck { font-family: var(--mono); font-size: 21px; color: var(--c); line-height: 1.3; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { border-radius: 12px; padding: 9px 11px; min-width: 0; border: 1px solid var(--line); background: var(--panel2); position: relative; overflow: hidden; }
  .stat::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--sc, var(--muted)); }
  .stat i { display: block; font-style: normal; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat b { display: block; font-family: var(--mono); font-weight: 400; font-size: 29px; line-height: 1.1; color: var(--sc, var(--text)); }
  .stat.tot { --sc: var(--ok); } .stat.tot.st-LOW { --sc: var(--warn); } .stat.tot.st-OUT { --sc: var(--flag); }
  .stat.n { --sc: var(--new); } .stat.u { --sc: var(--used); } .stat.r { --sc: var(--rg); }
  .hero.hasimg .stats { grid-template-columns: 1fr 1fr; align-content: start; }
  .kv { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { border: 1px solid var(--line2); border-radius: 999px; padding: 4px 11px; font-size: 14px; color: var(--muted); }
  .tag b { color: var(--text); font-weight: 500; font-family: var(--mono); }
  .tag.st-OK { border-color: rgba(61,220,151,.5); color: var(--ok); } .tag.st-LOW { border-color: rgba(255,194,61,.6); color: var(--warn); } .tag.st-OUT { border-color: rgba(255,77,94,.6); color: var(--flag); }
  .tag.rq { border-color: rgba(177,140,255,.6); color: var(--brand2); }
  .grps { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .grp { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 6px; background: var(--panel2); min-width: 0; }
  .grp h4 { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--gc, var(--muted)); font-weight: 400; padding-bottom: 4px; }
  .grp dl { display: grid; grid-template-columns: minmax(110px, 46%) 1fr; }
  .grp dt, .grp dd { padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
  .grp dt { color: var(--muted); padding-right: 8px; }
  .grp dd { font-family: var(--mono); font-size: 15px; }
  .grp dd a { color: var(--brand); font-family: var(--sans); }
  .cut { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  .cut table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .cut th, .cut td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  .cut th { font-weight: 500; color: var(--muted); font-size: 12px; background: var(--panel2); }
  .cut td { font-family: var(--mono); font-size: 15px; }
  .cut td.hi { color: var(--c); }
  .cut td:first-child, .cut th:first-child, .cut td:nth-child(2), .cut th:nth-child(2) { text-align: left; }
  .cut tr:last-child td { border-bottom: 0; }
  .sec { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--muted); }
  .dempty { margin: auto; color: var(--muted); font-size: 15px; padding: 28px; text-align: center; line-height: 1.7; }
  .dempty .big { font-size: 46px; display: block; margin-bottom: 6px; opacity: .5; }
  .note { font-size: 12px; color: var(--faint); }

  @media (max-width: 759px) {
    .detail.open { position: fixed; inset: 0; z-index: 30; border-radius: 0; border: 0; padding-bottom: env(safe-area-inset-bottom); animation: slide .18s ease-out; }
    .detail.open .dband { border-radius: 0; margin-top: env(safe-area-inset-top); }
    .detail:not(.open) { display: none; }
    .back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px 0; }
    .hero.hasimg { grid-template-columns: minmax(0, 1fr); }
    .hero.hasimg .stats, .stats { grid-template-columns: 1fr 1fr; }
    .dhead .rbtn { height: 40px; padding: 0 12px; font-size: 14px; }
    @keyframes slide { from { transform: translateX(16px); opacity: 0; } }
  }
  /* มือถือแนวนอน: เลื่อนทั้งหน้าได้ */
  @media (max-height: 500px) and (max-width: 1000px) { html, body { height: auto; } .app { height: auto; overflow: visible; } .list { max-height: 70vh; } }

  /* ---------- popup ---------- */
  .modal { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(4,6,10,.66); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
           padding: calc(max(12px, env(safe-area-inset-top)) + 6px) 12px max(12px, env(safe-area-inset-bottom)); }
  .modal.show { display: flex; justify-content: center; align-items: center; }
  .sheet { width: 100%; max-width: 560px; max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 18px;
           display: flex; flex-direction: column; animation: pop .16s ease-out; }
  .sheet.wide { max-width: 860px; }
  .sheet .sh { padding: 16px 18px 0; } .sheet .sb { padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
  .sheet .kicker { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; color: var(--brand2); }
  .sheet h3 { font-size: 23px; font-weight: 600; margin-top: 2px; }
  .sheet .actions { display: flex; gap: 10px; position: sticky; bottom: 0; padding: 12px 18px 16px; background: var(--panel); border-top: 1px solid var(--line); margin-top: auto; }
  .sheet .actions .btn { flex: 1; height: 54px; }
  .sheet .actions .btn.solid { flex: 1.6; }
  @keyframes pop { from { transform: translateY(-8px); opacity: 0; } }
  @media (max-width: 759px) { .modal.show { align-items: flex-start; } }
  .btn { padding: 12px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; color: var(--text); font-weight: 600; font-size: 17px; cursor: pointer; }
  .btn.solid { border: 0; color: #fff; background: linear-gradient(135deg, #ff8a3d, #ff5c8a); }
  .btn:disabled { opacity: .55; cursor: wait; }
  .field { width: 100%; height: 50px; background: var(--bg); border: 1px solid var(--line2); border-radius: 12px; color: var(--text); font: inherit; font-size: 17px; padding: 0 14px; outline: 0; }
  textarea.field { height: 76px; padding: 10px 14px; resize: vertical; }
  select.field { appearance: none; -webkit-appearance: none; padding-right: 34px;
                 background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
                 background-position: calc(100% - 18px) 22px, calc(100% - 13px) 22px; background-size: 5px 5px; background-repeat: no-repeat; }
  .field:focus { border-color: var(--brand); }
  .field.bad { border-color: var(--err); }
  .cap { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .cap em { font-style: normal; color: var(--err); }
  .fg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fg .full { grid-column: 1 / -1; }
  .qrow { display: flex; gap: 8px; } .qrow .field:first-child { width: 120px; text-align: right; font-family: var(--mono); font-size: 22px; }
  .pick { border: 1px solid color-mix(in srgb, var(--c) 50%, var(--line2)); background: color-mix(in srgb, var(--c) 10%, var(--panel2)); border-radius: 12px; padding: 10px 12px; }
  .pick b { display: block; font-size: 17px; } .pick small { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .seg { display: flex; border: 1px solid var(--line2); border-radius: 12px; overflow: hidden; flex: none; }
  .seg button { flex: 1; min-height: 44px; border: 0; background: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 6px 12px; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line2); }
  .seg button.on { background: var(--text); color: #111; font-weight: 600; }
  .msg { font-size: 15px; color: var(--err); } .msg:empty { display: none; }
  .tsg { border: 1px solid var(--line2); border-radius: 12px; background: var(--panel2); overflow: hidden; margin-top: 6px; }
  .tsg button { display: block; width: 100%; text-align: left; padding: 9px 12px; border: 0; background: none; color: var(--text); cursor: pointer; }
  .tsg button + button { border-top: 1px solid var(--line); }
  .tsg small { display: block; font-family: var(--mono); font-size: 12px; color: var(--muted); }

  /* ---------- ติดตามคำขอซื้อ ---------- */
  .rqs { display: flex; flex-direction: column; gap: 10px; }
  .rq { border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; background: var(--panel2); display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; }
  .rq b { font-size: 17px; font-weight: 600; }
  .rq .qn { font-family: var(--mono); font-size: 21px; text-align: right; }
  .rq .rm { grid-column: 1 / -1; font-size: 14px; color: var(--muted); line-height: 1.5; }
  .rq .rm span { font-family: var(--mono); color: var(--text); }
  .steps { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 2px; }
  .steps div { font-size: 12px; color: var(--faint); border-top: 4px solid var(--line2); padding-top: 5px; line-height: 1.35; min-width: 0; }
  .steps div b { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
  .steps div.done { border-color: var(--sc); color: var(--muted); } .steps div.done b { color: var(--sc); }
  .steps div.cur b::after { content: ' ●'; animation: blink 1.2s infinite; }
  .rq.Cancelled { opacity: .6; } .rq.Cancelled .steps { display: none; }
  .rqst { font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .rqst.Cancelled { color: var(--muted); border-color: var(--line2); }

  /* ---------- สแกน ---------- */
  .scan { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; }
  .scan video { flex: 1; min-height: 0; width: 100%; object-fit: cover; }
  .scanframe { position: absolute; left: 50%; top: 38%; width: min(78vw, 380px); height: min(36vw, 180px); transform: translate(-50%, -50%);
               border: 2px solid rgba(255,255,255,.85); border-radius: 14px; box-shadow: 0 0 0 9999px rgba(0,0,0,.38); pointer-events: none; }
  .scanframe::after { content: ''; position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: #ff8a3d; animation: scanline 1.6s ease-in-out infinite; }
  @keyframes scanline { 0%,100% { transform: translateY(-34px); } 50% { transform: translateY(34px); } }
  .scanbar { flex: none; background: var(--panel); border-top: 1px solid var(--line2); display: flex; flex-direction: column; gap: 10px; padding: 14px 16px max(16px, env(safe-area-inset-bottom)); }
  @media (min-width: 760px) { .scanbar { max-width: 560px; width: 100%; margin: 0 auto; border-radius: 16px 16px 0 0; } }
  .scanbar .smsg { font-size: 16px; text-align: center; min-height: 22px; } .scanbar .smsg.err { color: var(--warn); }
  .scanman { display: flex; gap: 8px; } .scanman .btn { flex: none; width: 88px; } .scanman .field { font-family: var(--mono); }

  .toast { position: fixed; left: 50%; top: calc(max(12px, env(safe-area-inset-top)) + 4px); z-index: 70; transform: translate(-50%, -20px); opacity: 0;
           background: var(--text); color: #111; padding: 12px 18px; border-radius: 12px; font-size: 16px; transition: all .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--err); color: #fff; } .toast.warn { background: var(--warn); color: #111; } .toast.ok { background: var(--ok); color: #062014; }
</style>

<body>

<div class="modal" id="modal"><div class="sheet" id="sheet" role="dialog" aria-modal="true">

</div></div>

    <div class="scanman"><input class="field" id="scanInput" placeholder="หรือพิมพ์ / ยิงบาร์โค้ด" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"><button class="btn" type="button" id="scanOk">ตกลง</button></div>
    <button class="btn" type="button" id="scanClose">ปิดกล้อง</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  /* ================== CONFIG ================== */
  // ← Web app URL ของ Apps Script (ตัวเดียวกับแอป stock)
  var API_URL = 'https://script.google.com/macros/s/AKfycbyOI9xUTF7rsDNHp4dWps_79YvdOlq2r8MY0JYikqL0IGrHb8JiQcyEeWOiImDdDDeJNQ/exec';
  var ZXING_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
  var AUTO_REFRESH_MS = 60000;   // รีเฟรชยอดสต็อก + สถานะคำขอเองทุก 1 นาที (ตอนเปิดหน้าอยู่)

  /* สีประจำหมวด */
  var CAT_COLOR = { 'End Mill': '#4f8cff', 'Drill': '#22c3a6', 'Reamer': '#a78bfa', 'Tap': '#f472b6', 'Step Drill': '#38bdf8', 'Chamfer Tool': '#facc15',
                    'Carbide Insert': '#fb923c', 'Tool Holder': '#34d399', 'Lathe Holder': '#e879f9', 'Grinding Wheel': '#cbd5e1', 'Other': '#9ca3af' };
  var GROUP_COLOR = { GEOMETRY: '#4f8cff', THREAD: '#f472b6', INSERT: '#fb923c', HOLDER: '#34d399', 'GRINDING WHEEL': '#cbd5e1', MATERIAL: '#a78bfa',
                      IDENTIFICATION: '#38bdf8', STOCK: '#3ddc97', COST: '#ffc23d', OTHER: '#9ca3af' };
  var RQ = { Pending: ['รอรับทราบ', '#ff5c6c'], Acknowledged: ['รับทราบแล้ว', '#6ea8ff'], Ordered: ['สั่งซื้อแล้ว', '#ffc23d'], Received: ['ได้รับของแล้ว', '#3ddc97'], Cancelled: ['ยกเลิก', '#8e98aa'] };
  function colorOf(c) { if (CAT_COLOR[c]) return CAT_COLOR[c]; var h = 0; String(c).split('').forEach(function (x) { h = (h * 31 + x.charCodeAt(0)) % 360; }); return 'hsl(' + h + ',70%,62%)'; }

  var $ = function (s, el) { return (el || document).querySelector(s); };
  var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  function pad(n) { return ('0' + n).slice(-2); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function errMsg(e) { return (e && e.message) ? e.message : String(e); }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function n0(v) { var x = Number(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(x) ? x : 0; }
  function num(v) { var s = String(v == null ? '' : v).replace(/,/g, '').trim(); if (s === '') return ''; var x = Number(s); return isFinite(x) ? String(Math.round(x * 1000) / 1000) : s; }
  function fmtQ(x) { return Number(x || 0).toLocaleString(); }
  function boxTxt(b) { return String(b || '').replace(/^0 box \+ /, '').replace(/ \+ 0 pcs$/, ''); }
  function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function apiUrl() { return /^https:\/\/script\.google\.com\/.+\/exec\/?$/.test(API_URL) && API_URL.indexOf('PASTE_') < 0 ? API_URL : ''; }
  function toast(msg, kind) {
    var t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = 'toast'; }, kind === 'err' || kind === 'warn' ? 5000 : 2600);
  }

  /* ================== API (ลองใหม่เองเมื่อ Google ไม่ว่าง) ================== */
  var TRANSIENT = /timed? ?out|timeout|too many|simultaneous|unavailable|try again|server error|service|lock|quota|internal|busy/i;
  var perf = null;
  function softErr(m) { var e = new Error(m); e.transient = true; return e; }
  function apiOnce(body) {
    var ctl = window.AbortController ? new AbortController() : null, timer = ctl ? setTimeout(function () { ctl.abort(); }, 30000) : null, t0 = Date.now();
    return fetch(apiUrl(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.text().then(function (t) { return { status: r.status, txt: t }; }); },
            function (e) { throw softErr(e && e.name === 'AbortError' ? 'เซิร์ฟเวอร์ตอบช้าเกินไป' : 'เชื่อมต่อไม่ได้ — ตรวจอินเทอร์เน็ต'); })
      .then(function (x) {
        perf = { ms: Date.now() - t0, kb: Math.round(x.txt.length / 102.4) / 10, a: body.action };
        var d; try { d = JSON.parse(x.txt); } catch (e) { throw softErr('เซิร์ฟเวอร์ Google ไม่ว่างชั่วคราว (HTTP ' + x.status + ')'); }
        if (d.error) { var e2 = new Error(d.error); e2.transient = TRANSIENT.test(d.error); throw e2; }
        return d;
      }).then(function (d) { if (timer) clearTimeout(timer); return d; }, function (e) { if (timer) clearTimeout(timer); throw e; });
  }
  function api(body) {
    if (!apiUrl()) return Promise.reject(new Error('ยังไม่ได้ใส่ API_URL ในไฟล์ index.html'));
    var n = 0;
    function go() { n++; return apiOnce(body).catch(function (e) { if (!e.transient || n >= 4) throw e; return new Promise(function (r) { setTimeout(r, [0, 800, 2000, 4000][n] + Math.random() * 600); }).then(go); }); }
    return go();
  }

  /* ================== ข้อมูล: เก็บในเครื่อง → เปิดแล้วเห็นทันที, ซิงค์เบื้องหลัง ================== */
  var CKEY = 'toolview.cat';
  var cat = null, tools = [], byId = {}, cutIdx = {}, sel = null;
  var state = { q: '', c: '', stock: false, low: false, out: false, shown: 120 };

  function setCat(c) {
    if (!c) return;
    var spec = c.spec || (cat && cat.ver === c.ver ? cat.spec : null);
    if (!spec) return;
    cat = { ver: c.ver, spec: spec, stock: c.stock, at: c.at, people: c.people || (cat && cat.people) || [], reqs: c.reqs || (cat && cat.reqs) || [] };
    lsSet(CKEY, cat);
    index();
  }
  function index() {
    tools = []; byId = {}; cutIdx = {};
    var cols = cat.spec.cols, order = {};
    (cat.spec.lists && cat.spec.lists['Category'] || []).forEach(function (c, i) { order[c] = i; });
    cat.spec.rows.forEach(function (r) {
      var t = {};
      cols.forEach(function (c, i) { t[c.k] = r[i]; });
      t.id = String(t.id); t.s = stockOf(t.id); t.line = specLine(t); t.col = colorOf(t.cat); t.img = photoSrc(t, 'w200');
      t.blob = [t.id, t.desc, t.pn, t.brand, t.isocode, t.cb, t.grade, t.sub, t.cat, t.thread, t.coat, t.loc, t.intf, t.clamp, t.wspec, t.line].join(' ').toLowerCase();
      t.ord = order[t.cat] != null ? order[t.cat] : 99;
      tools.push(t); byId[t.id] = t;
    });
    tools.sort(function (a, b) { return a.ord - b.ord || n0(a.d1) - n0(b.d1) || String(a.desc).localeCompare(String(b.desc)); });
    var cut = cat.spec.cut || { h: [], rows: [] };
    cut.rows.forEach(function (r) { (cutIdx[r[0]] = cutIdx[r[0]] || []).push(r); });
  }
  function stockOf(id) {
    var s = { ohn: 0, ohu: 0, atrg: 0, ohbox: '', tot: 0, status: '', value: 0, min: 0 }, m = cat.stock && cat.stock.map[id];
    if (m) cat.stock.keys.forEach(function (k, i) { s[k] = m[i]; });
    ['ohn', 'ohu', 'atrg', 'tot', 'value', 'min'].forEach(function (k) { s[k] = n0(s[k]); });
    return s;
  }
  function photoSrc(t, size) {
    var p = String(t.photo || ''), m = p.match(/\/d\/([\w-]{10,})|[?&]id=([\w-]{10,})/);
    if (m && /google\.com/.test(p)) return 'https://drive.google.com/thumbnail?id=' + (m[1] || m[2]) + '&sz=' + (size || 'w1000');
    return /^https?:\/\/.+\.(jpe?g|png|webp|gif)(\?|$)/i.test(p) ? p : '';
  }
  function specLine(t) {
    var p = [];
    function add(pre, v, post) { v = num(v); if (v !== '' && v !== '0') p.push((pre || '') + v + (post || '')); }
    function txt(v) { if (v) p.push(v); }
    switch (t.cat) {
      case 'End Mill': add('Ø', t.d1); add('Lc', t.lc); add('L', t.oal); add('', t.z, 'F'); add('R', t.r); txt(t.coat); break;
      case 'Drill': add('Ø', t.d1); add('Lc', t.lc); add('L', t.oal); add('', t.ang, '°'); txt(t.coat); break;
      case 'Reamer': add('Ø', t.d1); txt(t.tol); add('L', t.oal); break;
      case 'Tap': txt(t.thread); txt(t.taptype); txt(t.tol); break;
      case 'Step Drill': add('Ø', t.d1); add('Ø', t.d2); add('', t.ang, '°'); break;
      case 'Chamfer Tool': add('Ø', t.d1); add('', t.ang, '°'); break;
      case 'Carbide Insert': txt(t.isocode ? t.isocode + (t.cb ? '-' + t.cb : '') : ''); add('R', t.r); txt(t.grade); add('', t.corners, ' มุม'); break;
      case 'Tool Holder': txt(t.intf); txt(t.clamp); txt(t.crange); add('GL', t.gl); break;
      case 'Lathe Holder': txt(t.intf); txt(t.hand); txt(t.fit); break;
      case 'Grinding Wheel': txt(t.wsize); txt(t.wspec); break;
      default: add('Ø', t.d1); add('L', t.oal);
    }
    return p.join(' · ');
  }
  function openReqs() { return ((cat && cat.reqs) || []).filter(function (r) { return r.status !== 'Received' && r.status !== 'Cancelled'; }); }
  function reqsOf(id) { return openReqs().filter(function (r) { return r.id === id; }); }

  var refreshing = false;
  function refresh(manual) {
    if (refreshing) return;
    refreshing = true; document.body.dataset.sync = 'busy';
    api({ action: 'catalog', ver: cat ? cat.ver : '' }).then(function (d) {
      setCat(d.cat); render(); if (sel) showDetail(byId[sel] ? sel : null, true);
      if ($('#modal').classList.contains('show') && modal.onRefresh) modal.onRefresh();
      document.body.dataset.sync = 'idle';
      if (manual) toast('อัปเดตแล้ว ✓');
    }, function (e) {
      document.body.dataset.sync = 'err';
      if (manual || !cat) toast('โหลดข้อมูลไม่สำเร็จ: ' + errMsg(e), 'err');
      if (!cat) $('#list').innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ<br>' + esc(errMsg(e)) + '</div>';
    }).then(function () { refreshing = false; paintUpd(); });
  }
  function paintUpd() {
    if (!cat) return;
    var d = new Date(cat.at);
    $('#upd').textContent = 'ข้อมูล ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('#sync').title = 'อัปเดตล่าสุด ' + d.toLocaleString('th-TH') + (perf ? ' · ตอบกลับ ' + perf.ms + ' ms · ' + perf.kb + ' KB' : '');
  }

  /* ================== ค้นหา + รายการ ================== */
  function match(t, toks) {
    return toks.every(function (k) {
      if (t.blob.indexOf(k) >= 0) return true;
      var m = k.match(/^[øød]?(\d+(?:\.\d+)?)$/);
      return !!m && (num(t.d1) === m[1] || num(t.d2) === m[1]);
    });
  }
  function filtered() {
    var toks = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    return tools.filter(function (t) {
      if (state.c && t.cat !== state.c) return false;
      if (state.stock && t.s.tot <= 0) return false;
      if (state.low && t.s.status !== 'LOW') return false;
      if (state.out && t.s.status !== 'OUT') return false;
      return !toks.length || match(t, toks);
    });
  }
  function hl(text) {
    text = String(text || '');
    var k = state.q.trim().toLowerCase().split(/\s+/)[0], i = k ? text.toLowerCase().indexOf(k) : -1;
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + k.length)) + '</mark>' + esc(text.slice(i + k.length));
  }
  function cats() {
    var counts = {}; tools.forEach(function (t) { counts[t.cat] = (counts[t.cat] || 0) + 1; });
    var list = (cat.spec.lists && cat.spec.lists['Category'] || []).filter(function (c) { return counts[c]; });
    Object.keys(counts).forEach(function (c) { if (list.indexOf(c) < 0) list.push(c); });
    return { list: list, counts: counts };
  }
  function renderNav() {
    var c = cats(), low = tools.filter(function (t) { return t.s.status === 'LOW'; }).length, out = tools.filter(function (t) { return t.s.status === 'OUT'; }).length;
    var oq = openReqs().length;
    $('#k1').textContent = tools.length; $('#k2').textContent = low; $('#k3').textContent = out; $('#k4').textContent = oq;
    $('#trkN').textContent = oq;
    $('.kpi.k1').classList.toggle('on', !state.c && !state.low && !state.out && !state.stock && !state.q);

        scanner.stream = st; video.srcObject = st;
        return video.play().then(function () {
          var det = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code', 'data_matrix'] });
          scanMsg('เล็งบาร์โค้ดให้อยู่ในกรอบ');
          (function loop() { if (!scanner.on) return; det.detect(video).then(function (c) { if (c && c.length) found(c[0].rawValue); else setTimeout(loop, 120); }, function () { setTimeout(loop, 250); }); })();
        });
      }).catch(fail);
    } else {
      (window.ZXing ? Promise.resolve() : loadScript(ZXING_URL)).then(function () {
        if (!scanner.on) return;
        var Z = window.ZXing, h = new Map();
        h.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.ITF, Z.BarcodeFormat.QR_CODE, Z.BarcodeFormat.DATA_MATRIX]);
        h.set(Z.DecodeHintType.TRY_HARDER, true);
        scanner.reader = new Z.BrowserMultiFormatReader(h, 120);
        return scanner.reader.decodeFromConstraints(cons, video, function (res) { if (res) found(res.getText()); }).then(function () { if (scanner.on) scanMsg('เล็งบาร์โค้ดให้อยู่ในกรอบ'); });
      }).catch(fail);
    }
  }
  function closeScanner() {
    scanner.on = false;
    try { if (scanner.reader) scanner.reader.reset(); } catch (e) {}
    scanner.reader = null;
    if (scanner.stream) { scanner.stream.getTracks().forEach(function (x) { x.stop(); }); scanner.stream = null; }
    var v = $('#scanVideo'); try { v.pause(); } catch (e) {} v.srcObject = null;
    $('#scan').hidden = true;
  }
  $('#scanBtn').addEventListener('click', openScanner);
  $('#scanClose').addEventListener('click', closeScanner);
  function manual() { var v = $('#scanInput').value.trim(); if (!v) return; closeScanner(); onCode(v); }
  $('#scanOk').addEventListener('click', manual);
  $('#scanInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); manual(); } });

  /* ================== wiring ================== */
  var qT = null;
  $('#q').addEventListener('input', function () {
    $('#clr').hidden = !$('#q').value;
    clearTimeout(qT); qT = setTimeout(function () { state.q = $('#q').value; state.shown = 120; render(); }, 90);
  });
  $('#q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); state.q = $('#q').value; render(); var f = filtered(); if (f.length) { showDetail(f[0].id); $('#q').blur(); } else if ($('#q').value.trim()) onCode($('#q').value); }
    if (e.key === 'Escape') { $('#q').value = ''; state.q = ''; $('#clr').hidden = true; render(); }
  });
  $('#clr').addEventListener('click', function () { $('#q').value = ''; state.q = ''; $('#clr').hidden = true; render(); $('#q').focus(); });
  document.addEventListener('keydown', function (e) {
    var a = document.activeElement, typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT');
    if (e.key === '/' && !typing && !$('#modal').classList.contains('show')) { e.preventDefault(); $('#q').focus(); $('#q').select(); }
    if (e.key === 'Escape') { if ($('#modal').classList.contains('show')) closeModal(); else if ($('#detail').classList.contains('open') && window.innerWidth < 760) closeDetail(); }
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !typing && !$('#modal').classList.contains('show')) {
      var f = filtered(), i = f.findIndex(function (t) { return t.id === sel; });
      i = Math.max(0, Math.min(f.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
      if (f[i]) { e.preventDefault(); showDetail(f[i].id); var r = $('.row[data-id="' + CSS.escape(f[i].id) + '"]'); if (r) r.scrollIntoView({ block: 'nearest' }); }
    }
  });
  function navClick(e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.t) { var k = b.dataset.t; state[k] = !state[k]; if (k === 'low' && state.low) state.out = false; if (k === 'out' && state.out) state.low = false; }
    else if (b.dataset.c != null) state.c = b.dataset.c;
    state.shown = 120; render();
  }
  $('#chips').addEventListener('click', navClick);
  $('#side').addEventListener('click', navClick);
  $('#kpis').addEventListener('click', function (e) {
    var b = e.target.closest('.kpi'); if (!b) return;
    var k = b.dataset.k;
    if (k === 'req') return openTrack();
    if (k === 'all') { state.c = ''; state.low = state.out = state.stock = false; state.q = ''; $('#q').value = ''; $('#clr').hidden = true; }
    if (k === 'low') { state.low = !state.low; state.out = false; }
    if (k === 'out') { state.out = !state.out; state.low = false; }
    render();
  });
  $('#list').addEventListener('click', function (e) {
    if (e.target.id === 'more') { state.shown += 200; render(); return; }
    var rq = e.target.closest('[data-req]'); if (rq) { openRequest(''); return; }
    var r = e.target.closest('.row'); if (r) showDetail(r.dataset.id);
  });
  $('#detail').addEventListener('click', function (e) {
    if (e.target.id === 'back') return closeDetail();
    var rq = e.target.closest('[data-req]'); if (rq) return openRequest(rq.dataset.req);
    var c = e.target.closest('[data-copy]');
    if (c) { var v = c.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { toast('คัดลอก ' + v + ' แล้ว'); }, function () { toast(v); }); }
  });
  $('#reqBtn').addEventListener('click', function () { openRequest(sel || ''); });
  $('#trkBtn').addEventListener('click', openTrack);
  $('#refresh').addEventListener('click', function () { refresh(true); });
  $('#sync').addEventListener('click', function () { toast(cat ? 'อัปเดต ' + new Date(cat.at).toLocaleTimeString('th-TH') + (perf ? ' · ตอบกลับ ' + perf.ms + ' ms · ' + perf.kb + ' KB' : '') : 'ยังไม่มีข้อมูล'); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (scanner.on) closeScanner(); } else refresh(); });
  setInterval(function () { if (!document.hidden) refresh(); }, AUTO_REFRESH_MS);

  // เปิดแอป: แสดงข้อมูลในเครื่องทันที แล้วค่อยถาม Google
  cat = lsGet(CKEY);
  if (cat && !(cat.spec && cat.spec.cols)) cat = null;
  if (cat) { index(); render(); paintUpd(); }
  var h0 = decodeURIComponent(location.hash.slice(1));
  if (h0 && cat && byId[h0]) showDetail(h0);
  else if (cat && tools.length && window.innerWidth >= 760) showDetail(filtered()[0] && filtered()[0].id);   // จอใหญ่: เปิดตัวแรกไว้เลย ไม่ให้ช่องขวาว่าง
  if (!apiUrl()) { $('#list').innerHTML = '<div class="empty">ผู้ดูแล: ยังไม่ได้ใส่ API_URL ในไฟล์ index.html</div>'; }
  else refresh();
  if (!cat) { var once = setInterval(function () { if (cat) { clearInterval(once); if (h0 && byId[h0]) showDetail(h0); else if (tools.length && window.innerWidth >= 760) showDetail(filtered()[0].id); } }, 150); setTimeout(function () { clearInterval(once); }, 15000); }
</script>
</body>
</html>
