<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tool Viewer</title>
<meta name="theme-color" content="#0d0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tool Viewer">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script>
  (function () {
    var d = document.documentElement, t = null, l = null;
    try { t = localStorage.getItem('tool.theme'); l = localStorage.getItem('toolview.layout'); } catch (e) {}
    d.dataset.theme = t === 'light' ? 'light' : 'dark';
    var w = window.innerWidth, h = window.innerHeight;
    d.dataset.layout = l === 'pc' || l === 'phone' ? l : (w >= 900 || (w > h && w >= 640) ? 'pc' : 'phone');
  })();
</script>
<style>
  /* ================= Design tokens (ชุดเดียวกับแอป Stock / Time Card) ================= */
  :root, :root[data-theme=dark] {
    color-scheme: dark;
    --bg: #0d0e0f; --panel: #151719; --panel2: #1c1f22; --line: #2a2e33; --line2: #3a3f45;
    --text: #ecebe7; --muted: #9a9ea3; --faint: #6a6e73;
    --accent: #2f4b70; --accent-2: #40618f; --accent-hi: #8ea9cf; --on-accent: #eaf0f8; --sel: #1d2530;
    --ok: #4fd18b; --warn: #ffc53d; --err: #ff6b6b;
    --shadow: 0 12px 30px rgba(0,0,0,.45); --scrim: rgba(0,0,0,.62);
  }
  :root[data-theme=light] {
    color-scheme: light;
    --bg: #f3f3f1; --panel: #ffffff; --panel2: #f6f6f4; --line: #e3e3df; --line2: #cfcfca;
    --text: #17191b; --muted: #5c6066; --faint: #8a8e93;
    --accent: #2f4b70; --accent-2: #3d5f8c; --accent-hi: #2f4b70; --on-accent: #ffffff; --sel: #e8eef6;
    --ok: #15803d; --warn: #a16207; --err: #c62828;
    --shadow: 0 12px 30px rgba(20,24,30,.14); --scrim: rgba(20,24,30,.38);
  }
  :root {
    --mono: 'Share Tech Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans Thai', system-ui, sans-serif;
    --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px; --fs-lg: 18px; --fs-xl: 22px; --fs-2xl: 28px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
    --r-sm: 10px; --r: 12px; --r-lg: 16px; --h: 48px;
  }
  :root[data-layout=pc] { --fs-xl: 24px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: var(--fs-md); line-height: 1.45; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  [hidden] { display: none !important; }
  button { touch-action: manipulation; font: inherit; color: inherit; }

  /* ================= โครงหน้า — ปรับตามขนาดจอ ทั้งหน้าไม่เลื่อน =================
     มุมมองเลือกเองจากขนาดจอ: จอกว้าง ≥ 900 px หรือมือถือแนวนอน → หลายคอลัมน์ · ที่เหลือ → คอลัมน์เดียว
     มือถือ: แถบบน · ตัวเลขสรุป · ค้นหา · หมวด · รายการ (เลื่อนในกล่อง) · แถบล่าง — รายละเอียดเปิดเต็มจอ
     คอม: หมวดซ้าย (จอ > 1100 px) · รายการกลาง · รายละเอียดขวา — แต่ละช่องเลื่อนในตัวเอง
     จอเตี้ย (≤ 600 px): รายละเอียดสูงเต็มขวา · ตัวเลขสรุปย่อเหลือแถวเดียว */
  .app { position: fixed; inset: 0; margin: 0 auto; display: grid; overflow: hidden; gap: var(--s3);
         grid-template-columns: minmax(0, 1fr);
         grid-template-rows: auto auto auto minmax(0, 1fr) auto;
         grid-template-areas: "top" "kpi" "ctl" "list" "foot";
         padding: max(var(--s3), env(safe-area-inset-top)) max(var(--s4), env(safe-area-inset-right)) max(var(--s2), env(safe-area-inset-bottom)) max(var(--s4), env(safe-area-inset-left)); }
  :root[data-layout=phone] .app { max-width: 860px; margin: 0 auto; }
  .top { grid-area: top; } .kpis { grid-area: kpi; } .controls { grid-area: ctl; } .listwrap { grid-area: list; } .foot { grid-area: foot; }
  .side { display: none; }
  .detail { grid-area: list; }
  :root[data-layout=pc] .app { gap: var(--s4) var(--s5); padding: max(var(--s4), env(safe-area-inset-top)) max(var(--s5), env(safe-area-inset-right)) max(var(--s2), env(safe-area-inset-bottom)) max(var(--s5), env(safe-area-inset-left));
       grid-template-columns: 220px minmax(380px, 1fr) minmax(440px, 1.1fr);
       grid-template-rows: auto auto minmax(0, 1fr) auto;
       grid-template-areas: "top top top" "side ctl kpi" "side list detail" "foot foot foot"; }
  :root[data-layout=pc] .side { display: flex; grid-area: side; }
  :root[data-layout=pc] .detail { grid-area: detail; }
  :root[data-layout=pc] .chips .cat { display: none; }
  @media (max-width: 1100px) {
    :root[data-layout=pc] .app { grid-template-columns: minmax(300px, 1fr) minmax(360px, 1.1fr); grid-template-areas: "top top" "ctl kpi" "list detail" "foot foot"; }
    :root[data-layout=pc] .side { display: none; }
    :root[data-layout=pc] .chips .cat { display: inline-flex; }
  }

  /* ---------- แถบบน ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 48px; padding-bottom: var(--s2); border-bottom: 1px solid var(--line); min-width: 0; }
  .brand { display: flex; align-items: center; gap: var(--s2); min-width: 0; font-family: var(--mono); font-size: var(--fs-sm); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  .brand b { color: var(--text); font-weight: 400; }
  .brand .cam-tag { overflow: hidden; text-overflow: ellipsis; }
  .sync { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); opacity: .6; cursor: pointer; }
  body[data-sync=busy] .sync { background: var(--accent-hi); opacity: 1; animation: blink 1s ease-in-out infinite; }
  body[data-sync=err] .sync { background: var(--warn); opacity: 1; }
  @keyframes blink { 50% { opacity: .25; } }
  .tacts { display: flex; align-items: center; gap: var(--s2); flex: none; }
  .upd { font-family: var(--mono); font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; margin-right: var(--s1); }
  .tbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; min-width: 44px; padding: 0 var(--s3); border-radius: var(--r-sm);
          border: 1px solid var(--line2); background: var(--panel); font-size: var(--fs-sm); cursor: pointer; white-space: nowrap; }
  .tbtn:hover { border-color: var(--accent-hi); }
  .tbtn svg { width: 18px; height: 18px; flex: none; }
  .tbtn .n { font-family: var(--mono); font-size: var(--fs-xs); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--line2); display: inline-grid; place-items: center; }
  .tbtn.trk .n.has { background: var(--accent-hi); color: var(--bg); }
  .tbtn.req { background: var(--accent); border-color: var(--accent-2); color: var(--on-accent); font-weight: 600; }
  :root[data-layout=phone] .upd, :root[data-layout=phone] .tbtn .tx, :root[data-layout=phone] .brand .cam-tag { display: none; }
  :root[data-layout=phone] .tbtn { padding: 0 var(--s2); }

  /* ---------- ตัวเลขสรุป ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s2); }
  .kpi { min-width: 0; min-height: 60px; padding: var(--s2) var(--s3); border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); text-align: left; cursor: pointer; }
  .kpi i { display: block; font-style: normal; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi b { display: block; font-family: var(--mono); font-weight: 400; font-size: var(--fs-xl); line-height: 1.2; }
  .kpi.k2 b { color: var(--warn); } .kpi.k3 b { color: var(--err); } .kpi.k4 b { color: var(--accent-hi); }
  .kpi.on { border-color: var(--accent-hi); background: var(--sel); }

  /* ---------- ค้นหา + หมวด ---------- */
  .controls { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
  .search { display: flex; align-items: center; height: var(--h); background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r); padding-left: var(--s3); }
  .search:focus-within { border-color: var(--accent-hi); }
  .search svg.mg { flex: none; width: 18px; height: 18px; color: var(--faint); }
  .search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 17px; padding: 0 var(--s2); }
  .search input::placeholder { color: var(--faint); }
  .search kbd { font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint); border: 1px solid var(--line2); border-radius: 6px; padding: 0 6px; margin-right: var(--s2); }
  :root[data-layout=phone] .search kbd { display: none; }
  .search .clr { flex: none; width: 40px; height: 100%; border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; }
  .cam { flex: none; width: 52px; height: 100%; border: 0; border-left: 1px solid var(--line2); background: none; cursor: pointer; display: grid; place-items: center; border-radius: 0 var(--r) var(--r) 0; }
  .cam svg { width: 22px; height: 22px; }
  .chips { display: flex; gap: var(--s2); overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 var(--s3); border: 1px solid var(--line2); border-radius: 999px; background: var(--panel);
          font-size: var(--fs-sm); color: var(--muted); cursor: pointer; white-space: nowrap; }
  .chip b { font-family: var(--mono); font-weight: 400; color: var(--faint); }
  .chip.on { background: var(--text); border-color: var(--text); color: var(--bg); font-weight: 600; }
  .chip.on b { color: var(--bg); opacity: .7; }

  /* ---------- หมวด (คอม) ---------- */
  .side { flex-direction: column; gap: 2px; min-height: 0; overflow-y: auto; }
  .side h5 { font-family: var(--mono); font-size: var(--fs-xs); letter-spacing: .12em; color: var(--muted); font-weight: 400; margin: var(--s2) var(--s2) var(--s1); }
  .side button { display: flex; align-items: center; gap: var(--s2); width: 100%; min-height: 40px; padding: 0 var(--s3); border: 0; border-radius: var(--r-sm); background: none;
                 color: var(--muted); text-align: left; font-size: var(--fs-sm); cursor: pointer; }
  .side button span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side button b { font-family: var(--mono); font-weight: 400; color: var(--faint); }
  .side button:hover { background: var(--panel); color: var(--text); }
  .side button.on { background: var(--sel); color: var(--text); box-shadow: inset 3px 0 0 var(--accent-hi); }
  .side button.on b { color: var(--text); }
  .side .sep { height: 1px; background: var(--line); margin: var(--s2); }

  /* ---------- รายการทูล ---------- */
  .listwrap { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .list { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); }
  .row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 2px var(--s3); align-items: center; width: 100%; min-height: 76px; padding: var(--s3); border: 0; background: none; text-align: left; cursor: pointer; }
  .row + .row { border-top: 1px solid var(--line); }
  .row:hover { background: var(--panel2); }
  .row.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent-hi); }
  .row .th { grid-row: 1 / span 3; align-self: center; width: 48px; height: 48px; border-radius: var(--r-sm); border: 1px solid var(--line2); background: var(--panel2);
             display: grid; place-items: center; font-family: var(--mono); font-size: var(--fs-xs); color: var(--muted); overflow: hidden; }
  .row .th img { width: 100%; height: 100%; object-fit: cover; }
  .row b { grid-column: 2; font-size: var(--fs-md); font-weight: 600; line-height: 1.3; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sp { grid-column: 2; font-family: var(--mono); font-size: var(--fs-sm); color: var(--accent-hi); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row small { grid-column: 2; font-size: var(--fs-xs); color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .q { grid-column: 3; grid-row: 1 / span 3; align-self: center; text-align: right; font-family: var(--mono); font-size: var(--fs-2xl); line-height: 1; min-width: 44px; }
  .row .q i { display: block; font-style: normal; font-size: var(--fs-xs); color: var(--muted); margin-top: var(--s1); white-space: nowrap; }
  .row.st-LOW .q { color: var(--warn); } .row.st-OUT .q { color: var(--err); }
  .row mark { background: none; color: inherit; text-decoration: underline; text-decoration-color: var(--accent-hi); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .empty { padding: var(--s5) var(--s4); color: var(--muted); text-align: center; font-size: var(--fs-sm); line-height: 1.6; }
  .more { width: 100%; min-height: 48px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; font-size: var(--fs-sm); }
  .fcount { font-size: var(--fs-xs); color: var(--faint); padding: 0 var(--s1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- รายละเอียด ---------- */
  .detail { min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); }
  .dbody { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
  :root[data-layout=pc] .dbody { padding: var(--s5); }
  .dhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s1) var(--s3); align-items: start; }
  .dhead .back { grid-column: 1 / -1; }
  .dhead .kicker { font-family: var(--mono); font-size: var(--fs-xs); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
  .dhead h2 { grid-column: 1; font-size: var(--fs-xl); font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .dhead .idl { grid-column: 1; display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; font-family: var(--mono); font-size: var(--fs-sm); color: var(--muted); }
  .dhead .rbtn { grid-column: 2; grid-row: 2 / span 3; align-self: start; }
  .copy { height: 28px; padding: 0 var(--s2); border: 1px solid var(--line2); border-radius: 8px; background: none; color: var(--muted); font-size: var(--fs-xs); cursor: pointer; }
  .rbtn { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 var(--s4); border-radius: var(--r); border: 1px solid var(--accent-2); background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: var(--fs-sm); cursor: pointer; white-space: nowrap; }
  .rbtn svg { width: 18px; height: 18px; }
  .back { display: none; }
  :root[data-layout=phone] .back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin: calc(var(--s2) * -1) 0 0; background: none; border: 0; color: var(--muted); font-size: var(--fs-md); cursor: pointer; }
  .speck { font-family: var(--mono); font-size: var(--fs-lg); color: var(--accent-hi); line-height: 1.35; }
  .hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s3); }
  :root[data-layout=pc] .hero.hasimg { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .hero .img { display: block; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: #000; }
  .hero .img img { display: block; width: 100%; height: 100%; max-height: 240px; object-fit: contain; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s2); }
  :root[data-layout=phone] .stats, :root[data-layout=pc] .hero.hasimg .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; }
  .stat { min-width: 0; padding: var(--s2) var(--s3); border: 1px solid var(--line); border-radius: var(--r); background: var(--panel2); }
  .stat i { display: block; font-style: normal; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat b { display: block; font-family: var(--mono); font-weight: 400; font-size: var(--fs-2xl); line-height: 1.15; }
  .stat.tot { border-color: var(--line2); } .stat.tot.st-LOW b { color: var(--warn); } .stat.tot.st-OUT b { color: var(--err); }
  .kv { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 0 var(--s3); border: 1px solid var(--line2); border-radius: 999px; font-size: var(--fs-sm); color: var(--muted); }
  .tag b { color: var(--text); font-weight: 500; font-family: var(--mono); }
  .tag.st-OK { border-color: var(--ok); color: var(--ok); } .tag.st-LOW { border-color: var(--warn); color: var(--warn); } .tag.st-OUT { border-color: var(--err); color: var(--err); }
  .tag.rq { border-color: var(--accent-hi); color: var(--accent-hi); }
  .sec { font-family: var(--mono); font-size: var(--fs-xs); letter-spacing: .12em; color: var(--muted); margin-bottom: calc(var(--s2) * -1); }
  .grps { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--s3); }
  .grp { min-width: 0; padding: var(--s2) var(--s3) var(--s1); border: 1px solid var(--line); border-radius: var(--r); background: var(--panel2); }
  .grp h4 { font-family: var(--mono); font-size: var(--fs-xs); letter-spacing: .12em; color: var(--muted); font-weight: 400; padding-bottom: var(--s1); }
  .grp dl { display: grid; grid-template-columns: minmax(104px, 45%) minmax(0, 1fr); }
  .grp dt, .grp dd { padding: 6px 0; border-top: 1px solid var(--line); font-size: var(--fs-sm); min-width: 0; overflow-wrap: anywhere; }
  .grp dt { color: var(--muted); padding-right: var(--s2); }
  .grp dd { font-family: var(--mono); }
  .grp dd a { color: var(--accent-hi); font-family: var(--sans); }
  .cut { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
  .cut table { border-collapse: collapse; width: 100%; }
  .cut th, .cut td { padding: var(--s2) var(--s3); text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  .cut th { font-weight: 500; color: var(--muted); font-size: var(--fs-xs); background: var(--panel2); }
  .cut td { font-family: var(--mono); font-size: var(--fs-sm); }
  .cut td.hi { color: var(--accent-hi); }
  .cut td:first-child, .cut th:first-child, .cut td:nth-child(2), .cut th:nth-child(2) { text-align: left; }
  .cut tr:last-child td { border-bottom: 0; }
  .dempty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 200px; padding: var(--s5); color: var(--muted); font-size: var(--fs-sm); text-align: center; line-height: 1.7; }
  .note { font-size: var(--fs-xs); color: var(--faint); }
  :root[data-layout=phone] .detail.open { position: fixed; inset: 0; z-index: 30; border-radius: 0; border: 0;
       padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); animation: slide .18s ease-out; }
  :root[data-layout=phone] .detail:not(.open) { display: none; }
  @keyframes slide { from { transform: translateX(16px); opacity: 0; } }

  /* ---------- แถบล่าง: ธีม + มุมมอง ---------- */
  .foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); padding-top: var(--s2); border-top: 1px solid var(--line); min-width: 0; }
  .foot .fnote { font-size: var(--fs-xs); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .prefs { display: flex; gap: var(--s2); flex: none; }

        if (!(Number(fq.value) > 0)) { fq.classList.add('bad'); msg.textContent = 'กรอกจำนวน'; return; }
        lsSet(WHO_KEY, by.value);
        var body = { action: 'request', rid: rid(), by: by.value, id: t ? t.id : '', desc: t ? '' : desc.trim(), qty: Number(fq.value), unit: unit,
                     need: wrap.querySelector('.f-need').value, reason: wrap.querySelector('.f-why').value.trim() };
        sending = true; $('#mOk').disabled = true; $('#mOk').textContent = 'กำลังส่ง…'; msg.textContent = '';
        api(body).then(function (r) {
          if (cat) { cat.reqs = r.reqs || cat.reqs; lsSet(CKEY, cat); }
          closeModal(); render(); if (sel) showDetail(sel, true);
          toast('ส่งคำขอ ' + r.no + ' แล้ว — แจ้งเตือนไปที่แอป Tool Stock', 'ok');
        }, function (e) {
          msg.textContent = 'ส่งไม่สำเร็จ: ' + errMsg(e) + ' — ลองกดส่งอีกครั้ง';
          $('#mOk').disabled = false; $('#mOk').textContent = 'ส่งคำขออีกครั้ง';
        }).then(function () { sending = false; });
        modal.rid = body.rid;
      } });
  }

  /* ================== ติดตามคำขอซื้อ ================== */
  function openTrack() {
    var tab = 'open', wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:12px';
    function steps(r) {
      var order = ['Pending', 'Acknowledged', 'Ordered', 'Received'], cur = order.indexOf(r.status);
      var who = [r.by + ' · ' + r.t.slice(5), r.ackBy ? r.ackBy + ' · ' + r.ackAt.slice(5) : '', r.ordBy ? r.ordBy + ' · ' + r.ordAt.slice(5) : '', r.rcvBy ? r.rcvBy + ' · ' + r.rcvAt.slice(5) : ''];
      var lab = ['ส่งคำขอ', 'รับทราบ', 'สั่งซื้อ', 'ได้รับของ'];
      return '<div class="steps">' + lab.map(function (l, i) {
        var done = i <= cur;
        return '<div class="' + (done ? 'done' : '') + (i === 3 ? ' last' : '') + (i === cur && cur < 3 ? ' cur' : '') + '"><b>' + l + '</b>' + esc(who[i]) + '</div>';
      }).join('') + '</div>';
    }
    function paint() {
      var all = (cat && cat.reqs) || [], open = openReqs(), list = tab === 'open' ? open : all;
      wrap.innerHTML = '<div class="seg" style="align-self:flex-start"><button type="button" data-tab="open" class="' + (tab === 'open' ? 'on' : '') + '">เปิดอยู่ (' + open.length + ')</button>' +
        '<button type="button" data-tab="all" class="' + (tab === 'all' ? 'on' : '') + '">ทั้งหมด 30 วัน (' + all.length + ')</button></div>' +
        (list.length ? '<div class="rqs">' + list.map(function (r) {
          var st = RQ[r.status] || [r.status];
          return '<div class="rq ' + esc(r.status) + '"><b>' + esc(r.desc || r.id) + '</b><span class="qn">' + fmtQ(r.qty) + ' ' + (r.unit === 'box' ? 'กล่อง' : 'ชิ้น') + '</span>' +
            '<div class="rm"><span>' + esc(r.no) + '</span> <span class="rqst ' + esc(r.status) + '">' + st[0] + '</span>' +
            (r.id ? ' · Tool ID <span>' + esc(r.id) + '</span>' : ' · ทูลใหม่') + (r.need ? ' · ต้องการภายใน <span>' + esc(r.need) + '</span>' : '') +
            (r.reason ? '<br>' + esc(r.reason) : '') + (r.note ? '<br>หมายเหตุ: ' + esc(r.note) : '') + '</div>' + steps(r) + '</div>';
        }).join('') + '</div>' : '<div class="empty">ไม่มีคำขอ' + (tab === 'open' ? 'ที่เปิดอยู่' : '') + '</div>');
    }
    wrap.addEventListener('click', function (e) { var b = e.target.closest('button[data-tab]'); if (b) { tab = b.dataset.tab; paint(); } });
    openModal({ kicker: 'TRACKING · สถานะอัปเดตเองทุก 1 นาที', title: 'ติดตามคำขอซื้อ', body: wrap, noOk: true, wide: true, onRefresh: paint });
    paint();
  }

  /* ================== สแกน ================== */
  var scanner = { on: false };
  function loadScript(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { no(new Error('โหลดตัวอ่านบาร์โค้ดไม่ได้')); }; document.head.appendChild(s); }); }
  function scanMsg(t, err) { var m = $('#scanMsg'); m.textContent = t; m.className = 'smsg' + (err ? ' err' : ''); }
  function onCode(code) {
    code = String(code || '').trim();
    var n = code.toUpperCase(), nz = n.replace(/^0+(?=\d)/, '');
    var t = byId[code] || tools.filter(function (x) { var id = x.id.toUpperCase(); return id === n || id.replace(/^0+(?=\d)/, '') === nz; })[0] ||
            tools.filter(function (x) { return x.pn && String(x.pn).toUpperCase().replace(/[^0-9A-Z]/g, '') === n.replace(/[^0-9A-Z]/g, ''); })[0];
    if (t) { state.q = ''; $('#q').value = ''; render(); showDetail(t.id); }
    else { state.q = code; $('#q').value = code; render(); toast('ไม่พบรหัส ' + code + ' ในระบบ', 'warn'); }
  }
  function openScanner() {
    scanner.on = true; $('#scan').hidden = false; $('#scanInput').value = ''; scanMsg('กำลังเปิดกล้อง…');
    var video = $('#scanVideo');
    function found(c) { if (!scanner.on || !c) return; closeScanner(); onCode(c); }
    function fail(e) { if (scanner.on) scanMsg(e && e.name === 'NotAllowedError' ? 'ไม่ได้อนุญาตกล้อง — พิมพ์รหัสด้านล่าง' : e && e.name === 'NotFoundError' ? 'ไม่พบกล้อง — พิมพ์ / ยิงบาร์โค้ดด้านล่าง' : errMsg(e), true); }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fail(new Error('เปิดกล้องไม่ได้ — พิมพ์ / ยิงบาร์โค้ดด้านล่าง'));
    var cons = { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
    if ('BarcodeDetector' in window) {
      navigator.mediaDevices.getUserMedia(cons).then(function (st) {
        if (!scanner.on) { st.getTracks().forEach(function (x) { x.stop(); }); return; }
        scanner.stream = st; video.srcObject = st;
        return video.play().then(function () {
          var det = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code', 'data_matrix'] });
          scanMsg('เล็งบาร์โค้ดให้อยู่ในกรอบ');
          (function loop() { if (!scanner.on) return; det.detect(video).then(function (c) { if (c && c.length) found(c[0].rawValue); else setTimeout(loop, 120); }, function () { setTimeout(loop, 250); }); })();
        });
      }).catch(fail);
    } else {
      (window.ZXing ? Promise.resolve() : loadScript(ZXING_URL)).then(function () {
        if (!scanner.on) return;
        var Z = window.ZXing, h = new Map();
        h.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.ITF, Z.BarcodeFormat.QR_CODE, Z.BarcodeFormat.DATA_MATRIX]);
        h.set(Z.DecodeHintType.TRY_HARDER, true);
        scanner.reader = new Z.BrowserMultiFormatReader(h, 120);
        return scanner.reader.decodeFromConstraints(cons, video, function (res) { if (res) found(res.getText()); }).then(function () { if (scanner.on) scanMsg('เล็งบาร์โค้ดให้อยู่ในกรอบ'); });
      }).catch(fail);
    }
  }
  function closeScanner() {
    scanner.on = false;
    try { if (scanner.reader) scanner.reader.reset(); } catch (e) {}
    scanner.reader = null;
    if (scanner.stream) { scanner.stream.getTracks().forEach(function (x) { x.stop(); }); scanner.stream = null; }
    var v = $('#scanVideo'); try { v.pause(); } catch (e) {} v.srcObject = null;
    $('#scan').hidden = true;
  }
  $('#scanBtn').addEventListener('click', openScanner);
  $('#scanClose').addEventListener('click', closeScanner);
  function manual() { var v = $('#scanInput').value.trim(); if (!v) return; closeScanner(); onCode(v); }
  $('#scanOk').addEventListener('click', manual);
  $('#scanInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); manual(); } });

  /* ================== wiring ================== */
  var qT = null;
  $('#q').addEventListener('input', function () {
    $('#clr').hidden = !$('#q').value;
    clearTimeout(qT); qT = setTimeout(function () { state.q = $('#q').value; state.shown = 120; render(); }, 90);
  });
  $('#q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); state.q = $('#q').value; render(); var f = filtered(); if (f.length) { showDetail(f[0].id); $('#q').blur(); } else if ($('#q').value.trim()) onCode($('#q').value); }
    if (e.key === 'Escape') { $('#q').value = ''; state.q = ''; $('#clr').hidden = true; render(); }
  });
  $('#clr').addEventListener('click', function () { $('#q').value = ''; state.q = ''; $('#clr').hidden = true; render(); $('#q').focus(); });
  document.addEventListener('keydown', function (e) {
    var a = document.activeElement, typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT');
    if (e.key === '/' && !typing && !$('#modal').classList.contains('show')) { e.preventDefault(); $('#q').focus(); $('#q').select(); }
    if (e.key === 'Escape') { if ($('#modal').classList.contains('show')) closeModal(); else if ($('#detail').classList.contains('open') && document.documentElement.dataset.layout === 'phone') closeDetail(); }
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !typing && !$('#modal').classList.contains('show')) {
      var f = filtered(), i = f.findIndex(function (t) { return t.id === sel; });
      i = Math.max(0, Math.min(f.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
      if (f[i]) { e.preventDefault(); showDetail(f[i].id); var r = $('.row[data-id="' + CSS.escape(f[i].id) + '"]'); if (r) r.scrollIntoView({ block: 'nearest' }); }
    }
  });
  function navClick(e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.t) { var k = b.dataset.t; state[k] = !state[k]; if (k === 'low' && state.low) state.out = false; if (k === 'out' && state.out) state.low = false; }
    else if (b.dataset.c != null) state.c = b.dataset.c;
    state.shown = 120; render();
  }
  $('#chips').addEventListener('click', navClick);
  $('#side').addEventListener('click', navClick);
  $('#kpis').addEventListener('click', function (e) {
    var b = e.target.closest('.kpi'); if (!b) return;
    var k = b.dataset.k;
    if (k === 'req') return openTrack();
    if (k === 'all') { state.c = ''; state.low = state.out = state.stock = false; state.q = ''; $('#q').value = ''; $('#clr').hidden = true; }
    if (k === 'low') { state.low = !state.low; state.out = false; }
    if (k === 'out') { state.out = !state.out; state.low = false; }
    render();
  });
  $('#list').addEventListener('click', function (e) {
    if (e.target.id === 'more') { state.shown += 200; render(); return; }
    var rq = e.target.closest('[data-req]'); if (rq) { openRequest(''); return; }
    var r = e.target.closest('.row'); if (r) showDetail(r.dataset.id);
  });
  $('#detail').addEventListener('click', function (e) {
    if (e.target.id === 'back') return closeDetail();
    var rq = e.target.closest('[data-req]'); if (rq) return openRequest(rq.dataset.req);
    var c = e.target.closest('[data-copy]');
    if (c) { var v = c.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { toast('คัดลอก ' + v + ' แล้ว'); }, function () { toast(v); }); }
  });
  $('#reqBtn').addEventListener('click', function () { openRequest(sel || ''); });
  $('#trkBtn').addEventListener('click', openTrack);
  $('#refresh').addEventListener('click', function () { refresh(true); });
  $('#sync').addEventListener('click', function () { toast(cat ? 'อัปเดต ' + new Date(cat.at).toLocaleTimeString('th-TH') + (perf ? ' · ตอบกลับ ' + perf.ms + ' ms · ' + perf.kb + ' KB' : '') : 'ยังไม่มีข้อมูล'); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (scanner.on) closeScanner(); } else refresh(); });
  setInterval(function () { if (!document.hidden) refresh(); }, AUTO_REFRESH_MS);


  /* ================== ธีม (มืด / สว่าง) + มุมมอง (มือถือ / คอม) — ปุ่มเล็กล่างสุด ================== */
  var PREF_ICON = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>',
    pc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>'
  };
  function savedLayout() { try { return localStorage.getItem(LAYOUT_KEY); } catch (e) { return null; } }
  function paintPrefs() {
    var d = document.documentElement, dark = d.dataset.theme !== 'light', pc = d.dataset.layout === 'pc';
    $$('[data-pref=theme]').forEach(function (b) { b.textContent = dark ? 'โหมดสว่าง' : 'โหมดมืด'; b.title = 'เปลี่ยนเป็น' + (dark ? 'ธีมสว่าง' : 'ธีมมืด'); });
    var lp = savedLayout(), ln = lp === 'phone' ? 'มือถือ' : lp === 'pc' ? 'คอม' : 'อัตโนมัติ';
    $$('[data-pref=layout]').forEach(function (b) { b.textContent = 'มุมมอง: ' + ln; b.title = 'กดเพื่อสลับ อัตโนมัติ → มือถือ → คอม'; });
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', dark ? '#0d0e0f' : '#f3f3f1');
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-pref]') : null;
    if (!b) return;
    var d = document.documentElement;
    if (b.dataset.pref === 'theme') { d.dataset.theme = d.dataset.theme === 'light' ? 'dark' : 'light'; try { localStorage.setItem('tool.theme', d.dataset.theme); } catch (x) {} }
    else {
      var cur = savedLayout(), next = cur === 'phone' ? 'pc' : cur === 'pc' ? '' : 'phone';
      try { if (next) localStorage.setItem(LAYOUT_KEY, next); else localStorage.removeItem(LAYOUT_KEY); } catch (x) {}
      applyLayout();
    }
    paintPrefs();
  });
  function autoLayout() { var w = window.innerWidth, h = window.innerHeight; return w >= 900 || (w > h && w >= 640) ? 'pc' : 'phone'; }
  function applyLayout() {                                  // อัตโนมัติ = ตามขนาดจอ (หมุนจอ / ย่อหน้าต่าง ปรับทันที)
    var l = savedLayout(), want = l === 'pc' || l === 'phone' ? l : autoLayout(), d = document.documentElement;
    if (d.dataset.layout === want) return;
    d.dataset.layout = want;
    if (want === 'phone') $('#detail').classList.remove('open');                      // หมุนเป็นแนวตั้ง: ไม่เด้งหน้ารายละเอียดทับ
    if (want === 'pc' && cat && tools.length && !$('#detail .dbody')) { var f = filtered()[0]; if (f) showDetail(f.id); }   // ช่องขวาไม่ว่าง
  }
  window.addEventListener('resize', applyLayout);
  window.addEventListener('orientationchange', function () { setTimeout(applyLayout, 120); });
  paintPrefs();

  // เปิดแอป: แสดงข้อมูลในเครื่องทันที แล้วค่อยถาม Google
  cat = lsGet(CKEY);
  if (cat && !(cat.spec && cat.spec.cols)) cat = null;
  if (cat) { index(); render(); paintUpd(); }
  var h0 = decodeURIComponent(location.hash.slice(1));
  if (h0 && cat && byId[h0]) showDetail(h0);
  else if (cat && tools.length && document.documentElement.dataset.layout === 'pc') showDetail(filtered()[0] && filtered()[0].id);   // จอใหญ่: เปิดตัวแรกไว้เลย ไม่ให้ช่องขวาว่าง
  if (!apiUrl()) { $('#list').innerHTML = '<div class="empty">ผู้ดูแล: ยังไม่ได้ใส่ API_URL ในไฟล์ index.html</div>'; }
  else refresh();
  if (!cat) { var once = setInterval(function () { if (cat) { clearInterval(once); if (h0 && byId[h0]) showDetail(h0); else if (tools.length && document.documentElement.dataset.layout === 'pc') showDetail(filtered()[0].id); } }, 150); setTimeout(function () { clearInterval(once); }, 15000); }
</script>
</body>
</html>
