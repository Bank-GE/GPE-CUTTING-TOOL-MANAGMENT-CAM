<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tool Viewer</title>
<meta name="theme-color" content="#0d0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tool Viewer">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0e0f; --panel: #151719; --panel2: #1c1f22; --line: #2a2e33; --line2: #3a3f45;
    --text: #ecebe7; --muted: #8d9196; --faint: #5f6368;
    --accent: #2f4b70; --accent-2: #40618f; --accent-hi: #8ea9cf; --on-accent: #eaf0f8;
    --in: #3d6fd6; --out: #d97757;
    --ok: #4fd18b; --warn: #ffc53d; --err: #ff5a5a; --flag: #ff4d4d;
    --mono: 'Share Tech Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans Thai', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button { touch-action: manipulation; font: inherit; }

  .app { max-width: 1320px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 12px;
         padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); padding-bottom: 9px; }
  .top .id { font-family: var(--mono); font-size: 13px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .id b { color: var(--text); font-weight: 400; }
  .top .acts { display: flex; gap: 16px; align-items: center; flex: none; }
  .top .upd { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
  .top button { background: none; border: 0; color: var(--muted); font-size: 15px; cursor: pointer; padding: 9px 2px; margin: -9px -2px; }
  .top button:hover { color: var(--text); }
  .sync { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 8px; vertical-align: 1px; background: var(--ok); opacity: .55; cursor: pointer; }
  body[data-sync=busy] .sync { background: var(--accent-hi); opacity: 1; animation: blink 1s ease-in-out infinite; }
  body[data-sync=err] .sync { background: var(--warn); opacity: 1; }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---------- ค้นหา ---------- */
  .controls { display: flex; flex-direction: column; gap: 10px; }
  .search { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding-left: 14px; }
  .search:focus-within { border-color: var(--accent-hi); }
  .search svg.mg { flex: none; width: 18px; height: 18px; color: var(--faint); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 17px; height: 50px; padding: 0 10px; }
  .search input::placeholder { color: var(--faint); }
  .search kbd { font-family: var(--mono); font-size: 12px; color: var(--faint); border: 1px solid var(--line2); border-radius: 6px; padding: 1px 7px; margin-right: 10px; }
  .search .clr { flex: none; border: 0; background: none; color: var(--muted); font-size: 20px; width: 40px; height: 50px; cursor: pointer; }
  .cam { flex: none; height: 50px; width: 56px; border: 0; border-left: 1px solid var(--line); background: none; color: var(--text); cursor: pointer; display: grid; place-items: center; border-radius: 0 12px 12px 0; }
  .cam svg { width: 24px; height: 24px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line2); border-radius: 999px; padding: 6px 13px; font-size: 14px; color: var(--muted); background: none; cursor: pointer; white-space: nowrap; }
  .chip b { font-family: var(--mono); font-weight: 400; margin-left: 4px; color: var(--faint); }
  .chip.on { background: var(--text); border-color: var(--text); color: #111; font-weight: 600; }
  .chip.on b { color: #555; }
  .chip.tg.on { background: var(--accent); border-color: var(--accent-2); color: var(--on-accent); }
  .chip.sep { border: 0; padding: 6px 2px; color: var(--line2); cursor: default; }
  .count { font-family: var(--mono); font-size: 13px; color: var(--muted); }

  /* ---------- รายการ + รายละเอียด ---------- */
  .layout { flex: 1 1 auto; display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
  .list { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
  .row { display: grid; grid-template-columns: 4px 1fr auto; gap: 0 12px; width: 100%; text-align: left; border: 0; background: none; color: var(--text);
         padding: 11px 14px 11px 0; cursor: pointer; align-items: center; }
  .row + .row { border-top: 1px solid var(--line); }
  .row:hover { background: var(--panel2); }
  .row.sel { background: #1d2530; }
  .row .bar { grid-row: 1 / span 3; align-self: stretch; border-radius: 0 3px 3px 0; background: transparent; }
  .row.st-LOW .bar { background: var(--warn); } .row.st-OUT .bar { background: var(--flag); }
  .row b { font-weight: 500; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sp { grid-column: 2; font-family: var(--mono); font-size: 14px; color: var(--accent-hi); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row small { grid-column: 2; font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .q { grid-column: 3; grid-row: 1 / span 3; text-align: right; font-family: var(--mono); font-size: 26px; line-height: 1; }
  .row .q i { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .03em; }
  .row.st-LOW .q { color: var(--warn); } .row.st-OUT .q { color: var(--flag); }
  .row mark { background: none; color: var(--accent-hi); }
  .empty { padding: 26px 16px; color: var(--muted); text-align: center; font-size: 15px; line-height: 1.6; }
  .more { width: 100%; border: 0; border-top: 1px solid var(--line); background: none; color: var(--muted); padding: 14px; cursor: pointer; font-size: 15px; }

  .detail { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .dhead .kicker { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  .dhead h2 { font-size: 23px; font-weight: 600; line-height: 1.25; margin-top: 3px; }
  .dhead .idl { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-family: var(--mono); font-size: 15px; color: var(--muted); }
  .dhead .copy { border: 1px solid var(--line2); background: none; color: var(--muted); border-radius: 8px; font-size: 12px; padding: 3px 9px; cursor: pointer; }
  .back { display: none; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--panel2); min-width: 0; }
  .stat i { display: block; font-style: normal; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat b { display: block; font-family: var(--mono); font-weight: 400; font-size: 28px; line-height: 1.1; }
  .stat.main { border-color: var(--line2); }
  .stat.main.st-LOW b { color: var(--warn); } .stat.main.st-OUT b { color: var(--flag); }
  .kv { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { border: 1px solid var(--line2); border-radius: 999px; padding: 4px 11px; font-size: 14px; color: var(--muted); }
  .tag b { color: var(--text); font-weight: 500; font-family: var(--mono); }
  .tag.st-OK { border-color: rgba(79,209,139,.5); color: var(--ok); } .tag.st-LOW { border-color: rgba(255,197,61,.6); color: var(--warn); } .tag.st-OUT { border-color: rgba(255,77,77,.6); color: var(--flag); }
  .speck { font-family: var(--mono); font-size: 20px; color: var(--accent-hi); line-height: 1.3; }
  .grp h4 { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 400; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .grp dl { display: grid; grid-template-columns: minmax(130px, 42%) 1fr; }
  .grp dt, .grp dd { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
  .grp dt { color: var(--muted); padding-right: 10px; }
  .grp dd { font-family: var(--mono); font-size: 16px; }
  .grp dd a { color: var(--accent-hi); font-family: var(--sans); }
  .cut { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  .cut table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .cut th, .cut td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  .cut th { font-weight: 500; color: var(--muted); font-size: 12px; background: var(--panel2); }
  .cut td { font-family: var(--mono); font-size: 15px; }
  .cut td:first-child, .cut th:first-child, .cut td:nth-child(2), .cut th:nth-child(2) { text-align: left; }
  .cut tr:last-child td { border-bottom: 0; }
  .dempty { color: var(--muted); font-size: 15px; padding: 28px 8px; text-align: center; line-height: 1.6; }
  .note { font-size: 13px; color: var(--faint); }

  @media (min-width: 960px) {
    .layout { grid-template-columns: minmax(440px, 1fr) minmax(460px, 560px); }
    .detail { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  }
  @media (max-width: 959px) {
    .detail.open { position: fixed; inset: 0; z-index: 30; border-radius: 0; border: 0; overflow: auto;
                   padding: max(14px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); animation: slide .18s ease-out; }
    .detail:not(.open) { display: none; }
    .back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; padding: 6px 0; margin-bottom: 4px; }
    .search kbd { display: none; }
    @keyframes slide { from { transform: translateX(16px); opacity: 0; } }
  }
  @media (max-width: 430px) { .stats { grid-template-columns: repeat(2, 1fr); } .top .upd { display: none; } }

  /* ---------- สแกน ---------- */
  .scan { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; }
  .scan video { flex: 1; min-height: 0; width: 100%; object-fit: cover; }
  .scanframe { position: absolute; left: 50%; top: 38%; width: min(78vw, 360px); height: min(36vw, 170px); transform: translate(-50%, -50%);
               border: 2px solid rgba(255,255,255,.85); border-radius: 14px; box-shadow: 0 0 0 9999px rgba(0,0,0,.38); pointer-events: none; }
  .scanframe::after { content: ''; position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: var(--out); animation: scanline 1.6s ease-in-out infinite; }
  @keyframes scanline { 0%,100% { transform: translateY(-34px); } 50% { transform: translateY(34px); } }
  .scanbar { flex: none; background: var(--panel); border-top: 1px solid var(--line2); display: flex; flex-direction: column; gap: 10px; padding: 14px 16px max(16px, env(safe-area-inset-bottom)); }
  .scanbar .msg { font-size: 16px; text-align: center; min-height: 22px; }
  .scanbar .msg.err { color: var(--warn); }
  .btn { padding: 12px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; color: var(--text); font-weight: 600; font-size: 17px; cursor: pointer; }
  .field { width: 100%; height: 52px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; color: var(--text); font: inherit; font-size: 18px; padding: 0 14px; outline: 0; font-family: var(--mono); }
  .scanman { display: flex; gap: 8px; } .scanman .btn { flex: none; width: 88px; }

  .toast { position: fixed; left: 50%; top: calc(max(12px, env(safe-area-inset-top)) + 4px); z-index: 70; transform: translate(-50%, -20px); opacity: 0;
           background: var(--text); color: #111; padding: 12px 18px; border-radius: 12px; font-size: 16px; transition: all .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--err); color: #fff; } .toast.warn { background: var(--warn); color: #111; }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <span class="id">Tool Viewer · <b>CAM</b><i class="sync" id="sync" title=""></i></span>
    <span class="acts"><span class="upd" id="upd"></span><button id="refresh">รีเฟรช</button></span>
  </div>

  <div class="controls">
    <label class="search">
      <svg class="mg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="ค้นหา รหัส / ชื่อ / ขนาด เช่น 10, M8" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <kbd>/</kbd><button class="clr" id="clr" type="button" aria-label="ล้าง" hidden>×</button>
      <button class="cam" id="scanBtn" type="button" aria-label="สแกนบาร์โค้ด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg></button>
    </label>
    <div class="chips" id="chips"></div>
  </div>

  <div class="layout">
    <section>
      <div class="list" id="list"><div class="empty">กำลังโหลดข้อมูลทูล…</div></div>
      <div class="note" style="margin-top:8px" id="foot"></div>
    </section>
    <aside class="detail" id="detail"><div class="dempty">เลือกทูลจากรายการ เพื่อดูขนาด สเปก สต็อก และ Cutting Data</div></aside>
  </div>
</main>

<div class="scan" id="scan" hidden>
  <video id="scanVideo" playsinline muted autoplay></video>
  <div class="scanframe"></div>
  <div class="scanbar">
    <div class="msg" id="scanMsg">กำลังเปิดกล้อง…</div>
    <div class="scanman"><input class="field" id="scanInput" placeholder="หรือพิมพ์ / ยิงบาร์โค้ด" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"><button class="btn" type="button" id="scanOk">ตกลง</button></div>
    <button class="btn" type="button" id="scanClose">ปิดกล้อง</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  /* ================== CONFIG ================== */
  // ← Web app URL ของ Apps Script (ตัวเดียวกับแอป stock) — แอปนี้อ่านอย่างเดียว ไม่มีคำสั่งเขียนข้อมูล
  var API_URL = 'https://script.google.com/macros/s/AKfycbyOI9xUTF7rsDNHp4dWps_79YvdOlq2r8MY0JYikqL0IGrHb8JiQcyEeWOiImDdDDeJNQ/exec';
  var ZXING_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
  var AUTO_REFRESH_MS = 60000;   // รีเฟรชยอดสต็อกเองทุก 1 นาที (ตอนเปิดหน้าอยู่)

  var $ = function (s, el) { return (el || document).querySelector(s); };
  var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  function pad(n) { return ('0' + n).slice(-2); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function errMsg(e) { return (e && e.message) ? e.message : String(e); }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function n0(v) { var x = Number(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(x) ? x : 0; }
  function num(v) { var s = String(v == null ? '' : v).replace(/,/g, '').trim(); if (s === '') return ''; var x = Number(s); return isFinite(x) ? String(Math.round(x * 1000) / 1000) : s; }
  function fmtQ(x) { return Number(x || 0).toLocaleString(); }
  function boxTxt(b) { return String(b || '').replace(/^0 box \+ /, '').replace(/ \+ 0 pcs$/, ''); }
  function apiUrl() { return /^https:\/\/script\.google\.com\/.+\/exec\/?$/.test(API_URL) && API_URL.indexOf('PASTE_') < 0 ? API_URL : ''; }
  function toast(msg, kind) {
    var t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = 'toast'; }, kind ? 5000 : 2200);
  }

  /* ================== API (อ่านอย่างเดียว · ลองใหม่เองเมื่อ Google ไม่ว่าง) ================== */
  var TRANSIENT = /timed? ?out|timeout|too many|simultaneous|unavailable|try again|server error|service|lock|quota|internal|busy/i;
  var perf = null;
  function softErr(m) { var e = new Error(m); e.transient = true; return e; }
  function apiOnce(body) {
    var ctl = window.AbortController ? new AbortController() : null, timer = ctl ? setTimeout(function () { ctl.abort(); }, 30000) : null, t0 = Date.now();
    return fetch(apiUrl(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.text().then(function (t) { return { status: r.status, txt: t }; }); },
            function (e) { throw softErr(e && e.name === 'AbortError' ? 'เซิร์ฟเวอร์ตอบช้าเกินไป' : 'เชื่อมต่อไม่ได้ — ตรวจอินเทอร์เน็ต'); })
      .then(function (x) {
        perf = { ms: Date.now() - t0, kb: Math.round(x.txt.length / 102.4) / 10 };
        var d; try { d = JSON.parse(x.txt); } catch (e) { throw softErr('เซิร์ฟเวอร์ Google ไม่ว่างชั่วคราว (HTTP ' + x.status + ')'); }
        if (d.error) { var e2 = new Error(d.error); e2.transient = TRANSIENT.test(d.error); throw e2; }
        return d;
      }).then(function (d) { if (timer) clearTimeout(timer); return d; }, function (e) { if (timer) clearTimeout(timer); throw e; });
  }
  function api(body) {
    if (!apiUrl()) return Promise.reject(new Error('ยังไม่ได้ใส่ API_URL ในไฟล์ index.html'));
    var n = 0;
    function go() { n++; return apiOnce(body).catch(function (e) { if (!e.transient || n >= 3) throw e; return new Promise(function (r) { setTimeout(r, [0, 800, 2000][n] + Math.random() * 600); }).then(go); }); }
    return go();
  }

  /* ================== ข้อมูล: เก็บในเครื่อง → เปิดแล้วเห็นทันที, ซิงค์เบื้องหลัง ================== */
  var CKEY = 'toolview.cat';
  var cat = null, tools = [], byId = {}, cutIdx = {}, sel = null;
  var state = { q: '', c: '', stock: false, low: false, shown: 80 };

  function setCat(c) {
    if (!c) return;
    var spec = c.spec || (cat && cat.ver === c.ver ? cat.spec : null);
    if (!spec) return;
    cat = { ver: c.ver, spec: spec, stock: c.stock, at: c.at };
    lsSet(CKEY, cat);
    index();
  }
  function index() {
    tools = []; byId = {}; cutIdx = {};
    var cols = cat.spec.cols;
    var order = {};
    (cat.spec.lists && cat.spec.lists['Category'] || []).forEach(function (c, i) { order[c] = i; });
    cat.spec.rows.forEach(function (r) {
      var t = {};
      cols.forEach(function (c, i) { t[c.k] = r[i]; });
      t.id = String(t.id);
      t.s = stockOf(t.id, t);
      t.line = specLine(t);
      t.blob = [t.id, t.desc, t.pn, t.brand, t.isocode, t.cb, t.grade, t.sub, t.cat, t.thread, t.coat, t.loc, t.intf, t.clamp, t.wspec, t.line].join(' ').toLowerCase();
      t.ord = order[t.cat] != null ? order[t.cat] : 99;
      tools.push(t); byId[t.id] = t;
    });
    tools.sort(function (a, b) { return a.ord - b.ord || n0(a.d1) - n0(b.d1) || String(a.desc).localeCompare(String(b.desc)); });
    var cut = cat.spec.cut || { h: [], rows: [] };
    cut.rows.forEach(function (r) { (cutIdx[r[0]] = cutIdx[r[0]] || []).push(r); });
  }
  function stockOf(id, t) {
    var s = { ohn: 0, ohu: 0, atrg: 0, ohbox: '', tot: 0, status: '', value: 0, min: 0 }, m = cat.stock && cat.stock.map[id];
    if (m) cat.stock.keys.forEach(function (k, i) { s[k] = m[i]; });
    ['ohn', 'ohu', 'atrg', 'tot', 'value', 'min'].forEach(function (k) { s[k] = n0(s[k]); });
    return s;
  }
  function specLine(t) {
    var p = [];
    function add(pre, v, post) { v = num(v); if (v !== '' && v !== '0') p.push((pre || '') + v + (post || '')); }
    function txt(v) { if (v) p.push(v); }
    switch (t.cat) {
      case 'End Mill': add('Ø', t.d1); add('Lc', t.lc); add('L', t.oal); add('', t.z, 'F'); add('R', t.r); txt(t.coat); break;
      case 'Drill': add('Ø', t.d1); add('Lc', t.lc); add('L', t.oal); add('', t.ang, '°'); txt(t.coat); break;
      case 'Reamer': add('Ø', t.d1); txt(t.tol); add('L', t.oal); break;
      case 'Tap': txt(t.thread); txt(t.taptype); txt(t.tol); break;
      case 'Step Drill': add('Ø', t.d1); add('Ø', t.d2); add('', t.ang, '°'); break;
      case 'Chamfer Tool': add('Ø', t.d1); add('', t.ang, '°'); break;
      case 'Carbide Insert': txt(t.isocode ? t.isocode + (t.cb ? '-' + t.cb : '') : ''); add('R', t.r); txt(t.grade); add('', t.corners, ' มุม'); break;
      case 'Tool Holder': txt(t.intf); txt(t.clamp); txt(t.crange); add('GL', t.gl); break;
      case 'Lathe Holder': txt(t.intf); txt(t.hand); txt(t.fit); break;
      case 'Grinding Wheel': txt(t.wsize); txt(t.wspec); break;
      default: add('Ø', t.d1); add('L', t.oal);
    }
    return p.join(' · ');
  }

  var refreshing = false;
  function refresh(manual) {
    if (refreshing) return;
    refreshing = true; document.body.dataset.sync = 'busy';
    api({ action: 'catalog', ver: cat ? cat.ver : '' }).then(function (d) {
      setCat(d.cat); render(); if (sel) showDetail(byId[sel] ? sel : null, true);
      document.body.dataset.sync = 'idle';
      if (manual) toast('อัปเดตแล้ว ✓');
    }, function (e) {
      document.body.dataset.sync = 'err';
      if (manual || !cat) toast('โหลดข้อมูลไม่สำเร็จ: ' + errMsg(e), 'err');
      if (!cat) $('#list').innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ<br>' + esc(errMsg(e)) + '</div>';
    }).then(function () { refreshing = false; paintUpd(); });
  }
  function paintUpd() {
    if (!cat) return;
    var d = new Date(cat.at);
    $('#upd').textContent = 'ข้อมูล ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('#sync').title = 'อัปเดตล่าสุด ' + d.toLocaleString('th-TH') + (perf ? ' · ตอบกลับ ' + perf.ms + ' ms · ' + perf.kb + ' KB' : '');
  }

  /* ================== ค้นหา + รายการ ================== */
  function match(t, toks) {
    return toks.every(function (k) {
      if (t.blob.indexOf(k) >= 0) return true;
      var m = k.match(/^[øød]?(\d+(?:\.\d+)?)$/);
      return !!m && (num(t.d1) === m[1] || num(t.d2) === m[1]);
    });
  }
  function filtered() {
    var toks = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    return tools.filter(function (t) {
      if (state.c && t.cat !== state.c) return false;
      if (state.stock && t.s.tot <= 0) return false;
      if (state.low && t.s.status !== 'LOW' && t.s.status !== 'OUT') return false;
      return !toks.length || match(t, toks);
    });
  }
  function hl(text) {
    text = String(text || '');
    var k = state.q.trim().toLowerCase().split(/\s+/)[0], i = k ? text.toLowerCase().indexOf(k) : -1;
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + k.length)) + '</mark>' + esc(text.slice(i + k.length));
  }
  function renderChips() {
    var counts = {}; tools.forEach(function (t) { counts[t.cat] = (counts[t.cat] || 0) + 1; });
    var cats = (cat.spec.lists && cat.spec.lists['Category'] || []).filter(function (c) { return counts[c]; });
    Object.keys(counts).forEach(function (c) { if (cats.indexOf(c) < 0) cats.push(c); });
    var low = tools.filter(function (t) { return t.s.status === 'LOW' || t.s.status === 'OUT'; }).length;
    $('#chips').innerHTML = '<button class="chip' + (!state.c ? ' on' : '') + '" data-c="">ทั้งหมด<b>' + tools.length + '</b></button>' +
      cats.map(function (c) { return '<button class="chip' + (state.c === c ? ' on' : '') + '" data-c="' + esc(c) + '">' + esc(c) + '<b>' + counts[c] + '</b></button>'; }).join('') +
      '<span class="chip sep">|</span><button class="chip tg' + (state.stock ? ' on' : '') + '" data-t="stock">มีของในสต็อก</button>' +
      '<button class="chip tg' + (state.low ? ' on' : '') + '" data-t="low">LOW / OUT<b>' + low + '</b></button>';
  }
  function render() {
    if (!cat) return;
    renderChips();
    var list = filtered();
    if (!list.length) {
      $('#list').innerHTML = '<div class="empty">' + (tools.length ? 'ไม่พบทูลที่ตรงกับ "' + esc(state.q) + '"' : 'ยังไม่มีทูลใน Tool_Master') + '</div>';
    } else {
      $('#list').innerHTML = list.slice(0, state.shown).map(function (t) {
        var s = t.s;
        return '<button class="row st-' + esc(s.status) + (sel === t.id ? ' sel' : '') + '" data-id="' + esc(t.id) + '"><span class="bar"></span>' +
          '<b>' + hl(t.desc || t.id) + '</b><span class="q">' + fmtQ(s.tot) + '<i>' + esc(s.ohbox ? boxTxt(s.ohbox) : (t.unit || 'pcs')) + '</i></span>' +
          (t.line ? '<span class="sp">' + hl(t.line) + '</span>' : '') +
          '<small>' + hl(t.id) + ' · ' + esc([t.cat, t.brand, t.loc].filter(Boolean).join(' · ')) + '</small></button>';
      }).join('') + (list.length > state.shown ? '<button class="more" id="more">แสดงเพิ่ม (' + (list.length - state.shown) + ')</button>' : '');
    }
    $('#foot').textContent = cat ? list.length + ' จาก ' + tools.length + ' รายการ · อ่านอย่างเดียว — แก้ข้อมูลที่ Google Sheet หรือแอป Tool Stock' : '';
  }

  /* ================== รายละเอียด ================== */
  var GROUP_ORDER = ['GEOMETRY', 'THREAD', 'INSERT', 'HOLDER', 'GRINDING WHEEL', 'MATERIAL', 'IDENTIFICATION', 'STOCK', 'COST', 'OTHER'];
  var HIDE = ['id', 'desc', 'cat', 'opn', 'opu', 'photo'];
  var CUT_SHOW = ['Work Material', 'Operation', 'Vc (m/min)', 'fz / fn (mm)', 'Feed Mode', 'ap (mm)', 'ae (mm)', 'RPM (n)', 'Feed Vf (mm/min)', 'Coolant', 'Tool Life (min)', 'Machine', 'Source', 'Remark'];
  function showDetail(id, keepScroll) {
    var el = $('#detail');
    sel = id;
    $$('.row').forEach(function (r) { r.classList.toggle('sel', r.dataset.id === id); });
    var t = id && byId[id];
    if (!t) { el.classList.remove('open'); el.innerHTML = '<div class="dempty">เลือกทูลจากรายการ เพื่อดูขนาด สเปก สต็อก และ Cutting Data</div>'; return; }
    var s = t.s, cols = cat.spec.cols, pb = n0(t.pcsbox);
    var groups = {};
    cols.forEach(function (c) {
      if (HIDE.indexOf(c.k) >= 0) return;
      var v = t[c.k];
      if (v == null || String(v).trim() === '') return;
      var g = c.g || 'OTHER';
      (groups[g] = groups[g] || []).push([c.h, v]);
    });
    var gnames = Object.keys(groups).sort(function (a, b) { var i = GROUP_ORDER.indexOf(a), j = GROUP_ORDER.indexOf(b); return (i < 0 ? 50 : i) - (j < 0 ? 50 : j); });
    var cut = cutIdx[t.id] || [], ch = (cat.spec.cut && cat.spec.cut.h) || [];
    var cidx = CUT_SHOW.map(function (h) { return ch.indexOf(h); }).filter(function (i) { return i >= 0; });
    cidx = cidx.filter(function (i) { return cut.some(function (r) { return String(r[i]).trim() !== ''; }); });
    var tags = [];
    tags.push('<span class="tag st-' + esc(s.status) + '">' + esc(s.status || '—') + (s.min ? ' · Min ' + fmtQ(s.min) : '') + '</span>');
    if (t.loc) tags.push('<span class="tag">ที่เก็บ <b>' + esc(t.loc) + '</b></span>');
    if (s.ohbox) tags.push('<span class="tag">ในกล่อง <b>' + esc(boxTxt(s.ohbox)) + '</b>' + (pb ? ' (กล่องละ ' + pb + ')' : '') + '</span>');
    if (n0(t.price)) tags.push('<span class="tag">ราคา/หน่วย <b>' + esc(t.price) + '</b> ฿</span>');
    if (s.value) tags.push('<span class="tag">มูลค่า New <b>' + fmtQ(Math.round(s.value)) + '</b> ฿</span>');
    el.innerHTML =
      '<div class="dhead"><button class="back" type="button" id="back">‹ กลับ</button>' +
      '<div class="kicker">' + esc([t.cat, t.sub].filter(Boolean).join(' · ')) + '</div><h2>' + esc(t.desc || t.id) + '</h2>' +
      '<div class="idl"><span>' + esc(t.id) + '</span><button class="copy" type="button" data-copy="' + esc(t.id) + '">คัดลอก</button>' +
      (t.pn ? '<span>' + esc(t.pn) + '</span><button class="copy" type="button" data-copy="' + esc(t.pn) + '">คัดลอก</button>' : '') + '</div></div>' +
      (t.line ? '<div class="speck">' + esc(t.line) + '</div>' : '') +
      '<div class="stats"><div class="stat main st-' + esc(s.status) + '"><i>รวมในสต็อก</i><b>' + fmtQ(s.tot) + '</b></div><div class="stat"><i>New</i><b>' + fmtQ(s.ohn) + '</b></div>' +
      '<div class="stat"><i>Used/Regrind</i><b>' + fmtQ(s.ohu) + '</b></div><div class="stat"><i>ที่ร้านรีกรายด์</i><b>' + fmtQ(s.atrg) + '</b></div></div>' +
      '<div class="kv">' + tags.join('') + '</div>' +
      (cidx.length ? '<div class="grp"><h4>CUTTING DATA</h4></div><div class="cut"><table><thead><tr>' + cidx.map(function (i) { return '<th>' + esc(ch[i]) + '</th>'; }).join('') +
        '</tr></thead><tbody>' + cut.map(function (r) { return '<tr>' + cidx.map(function (i) { return '<td>' + esc(num(r[i]) || r[i]) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' : '') +
      gnames.map(function (g) {
        return '<div class="grp"><h4>' + esc(g) + '</h4><dl>' + groups[g].map(function (kv) {
          var v = String(kv[1]);
          return '<dt>' + esc(kv[0]) + '</dt><dd>' + (/^https?:\/\//i.test(v) ? '<a href="' + esc(v) + '" target="_blank" rel="noopener">เปิดลิงก์</a>' : esc(/^-?[\d,]+(\.\d+)?$/.test(v) ? num(v) : v)) + '</dd>';
        }).join('') + '</dl></div>';
      }).join('') +
      (t.photo && /^https?:\/\//i.test(t.photo) ? '<a class="tag" href="' + esc(t.photo) + '" target="_blank" rel="noopener">รูป / Drawing ↗</a>' : '') +
      '<div class="note">ข้อมูลจาก Google Sheet · อัปเดต ' + esc(new Date(cat.at).toLocaleString('th-TH')) + '</div>';
    el.classList.add('open');
    if (!keepScroll) el.scrollTop = 0;
    try { history.replaceState(null, '', '#' + encodeURIComponent(t.id)); } catch (e) {}
  }
  function closeDetail() { $('#detail').classList.remove('open'); sel = null; $$('.row').forEach(function (r) { r.classList.remove('sel'); }); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }

  /* ================== สแกน ================== */
  var scanner = { on: false };
  function loadScript(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { no(new Error('โหลดตัวอ่านบาร์โค้ดไม่ได้')); }; document.head.appendChild(s); }); }
  function scanMsg(t, err) { var m = $('#scanMsg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); }
  function onCode(code) {
    code = String(code || '').trim();
    var n = code.toUpperCase(), nz = n.replace(/^0+(?=\d)/, '');
    var t = byId[code] || tools.filter(function (x) { var id = x.id.toUpperCase(); return id === n || id.replace(/^0+(?=\d)/, '') === nz; })[0] ||
            tools.filter(function (x) { return x.pn && String(x.pn).toUpperCase().replace(/[^0-9A-Z]/g, '') === n.replace(/[^0-9A-Z]/g, ''); })[0];
    if (t) { state.q = ''; $('#q').value = ''; render(); showDetail(t.id); }
    else { state.q = code; $('#q').value = code; render(); toast('ไม่พบรหัส ' + code + ' ในระบบ', 'warn'); }
  }
  function openScanner() {
    scanner.on = true; $('#scan').hidden = false; $('#scanInput').value = ''; scanMsg('กำลังเปิดกล้อง…');
    var video = $('#scanVideo');
    function found(c) { if (!scanner.on || !c) return; closeScanner(); onCode(c); }
    function fail(e) { if (scanner.on) scanMsg(e && e.name === 'NotAllowedError' ? 'ไม่ได้อนุญาตกล้อง — พิมพ์รหัสด้านล่าง' : errMsg(e), true); }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fail(new Error('เปิดกล้องไม่ได้ — พิมพ์ / ยิงบาร์โค้ดด้านล่าง'));
    var cons = { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
    if ('BarcodeDetector' in window) {
      navigator.mediaDevices.getUserMedia(cons).then(function (st) {
        if (!scanner.on) { st.getTracks().forEach(function (x) { x.stop(); }); return; }
        scanner.stream = st; video.srcObject = st;
        return video.play().then(function () {
          var det = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code', 'data_matrix'] });
          scanMsg('เล็งบาร์โค้ดให้อยู่ในกรอบ');
          (function loop() { if (!scanner.on) return; det.detect(video).then(function (c) { if (c && c.length) found(c[0].rawValue); else setTimeout(loop, 120); }, function () { setTimeout(loop, 250); }); })();
        });
      }).catch(fail);
    } else {
      (window.ZXing ? Promise.resolve() : loadScript(ZXING_URL)).then(function () {
        if (!scanner.on) return;
        var Z = window.ZXing, h = new Map();
        h.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.ITF, Z.BarcodeFormat.QR_CODE, Z.BarcodeFormat.DATA_MATRIX]);
        h.set(Z.DecodeHintType.TRY_HARDER, true);
        scanner.reader = new Z.BrowserMultiFormatReader(h, 120);
        return scanner.reader.decodeFromConstraints(cons, video, function (res) { if (res) found(res.getText()); }).then(function () { if (scanner.on) scanMsg('เล็งบาร์โค้ดให้อยู่ในกรอบ'); });
      }).catch(fail);
    }
  }
  function closeScanner() {
    scanner.on = false;
    try { if (scanner.reader) scanner.reader.reset(); } catch (e) {}
    scanner.reader = null;
    if (scanner.stream) { scanner.stream.getTracks().forEach(function (x) { x.stop(); }); scanner.stream = null; }
    var v = $('#scanVideo'); try { v.pause(); } catch (e) {} v.srcObject = null;
    $('#scan').hidden = true;
  }
  $('#scanBtn').addEventListener('click', openScanner);
  $('#scanClose').addEventListener('click', closeScanner);
  function manual() { var v = $('#scanInput').value.trim(); if (!v) return; closeScanner(); onCode(v); }
  $('#scanOk').addEventListener('click', manual);
  $('#scanInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); manual(); } });

  /* ================== wiring ================== */
  var qT = null;
  $('#q').addEventListener('input', function () {
    $('#clr').hidden = !$('#q').value;
    clearTimeout(qT); qT = setTimeout(function () { state.q = $('#q').value; state.shown = 80; render(); }, 90);
  });
  $('#q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); state.q = $('#q').value; render(); var f = filtered(); if (f.length) { showDetail(f[0].id); $('#q').blur(); } else if ($('#q').value.trim()) onCode($('#q').value); }
    if (e.key === 'Escape') { $('#q').value = ''; state.q = ''; $('#clr').hidden = true; render(); }
  });
  $('#clr').addEventListener('click', function () { $('#q').value = ''; state.q = ''; $('#clr').hidden = true; render(); $('#q').focus(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== $('#q') && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#q').focus(); $('#q').select(); }
    if (e.key === 'Escape' && $('#detail').classList.contains('open') && window.innerWidth < 960) closeDetail();
  });
  $('#chips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.t) state[b.dataset.t] = !state[b.dataset.t]; else state.c = b.dataset.c;
    state.shown = 80; render();
  });
  $('#list').addEventListener('click', function (e) {
    if (e.target.id === 'more') { state.shown += 120; render(); return; }
    var r = e.target.closest('.row'); if (r) showDetail(r.dataset.id);
  });
  $('#detail').addEventListener('click', function (e) {
    if (e.target.id === 'back') return closeDetail();
    var c = e.target.closest('[data-copy]');
    if (c) { var v = c.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { toast('คัดลอก ' + v + ' แล้ว'); }, function () { toast(v); }); }
  });
  $('#refresh').addEventListener('click', function () { refresh(true); });
  $('#sync').addEventListener('click', function () { toast(cat ? 'อัปเดต ' + new Date(cat.at).toLocaleTimeString('th-TH') + (perf ? ' · ตอบกลับ ' + perf.ms + ' ms · ' + perf.kb + ' KB' : '') : 'ยังไม่มีข้อมูล'); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (scanner.on) closeScanner(); } else refresh(); });
  setInterval(function () { if (!document.hidden) refresh(); }, AUTO_REFRESH_MS);

  // เปิดแอป: แสดงข้อมูลในเครื่องทันที แล้วค่อยถาม Google
  cat = lsGet(CKEY);
  if (cat && !(cat.spec && cat.spec.cols)) cat = null;
  if (cat) { index(); render(); paintUpd(); }
  var h0 = decodeURIComponent(location.hash.slice(1));
  if (h0 && cat && byId[h0]) showDetail(h0);
  if (!apiUrl()) { $('#list').innerHTML = '<div class="empty">ผู้ดูแล: ยังไม่ได้ใส่ API_URL ในไฟล์ index.html</div>'; }
  else refresh();
  if (h0 && !cat) { var once = setInterval(function () { if (cat) { clearInterval(once); if (byId[h0]) showDetail(h0); } }, 200); setTimeout(function () { clearInterval(once); }, 15000); }
</script>
</body>
